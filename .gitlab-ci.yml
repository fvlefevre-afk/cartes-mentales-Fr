# Publie le site avec GitLab Pages (Forge des communs numériques éducatifs)
pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html public/
    - cp -r images public/
    - cp -r polices public/
    - if [ -f ouvertures.json ]; then cp ouvertures.json public/; fi
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
