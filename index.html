<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leçons interactives — ceintures de français CM1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff;--ink:#1f2a44;--soft:#5b6479;--line:#d8dde8;
  --sujet:#1f5fc4;--verbe:#c62828;--term:#7b3fa0;--etiq:#d9730d;--etiq-bg:#fff1e3;--precis:#23845a;--precis-bg:#e8f5ee;
  --seyes-big:#b9c9e6;--seyes-small:#e3eaf6;--margin:#e7a3a3;
  --fam:#2456a6;
  --font:"Andika","Verdana","Trebuchet MS",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:#eef1f6;color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--etiq);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem 1rem}
.bar h1{margin:0;white-space:nowrap;font-size:1.1rem;cursor:pointer}
.bar h1:focus-visible{outline:2px solid #fff;outline-offset:3px}
.bar button{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:.5rem;padding:.3rem .8rem;font-size:.88rem;cursor:pointer}
.bar button:hover{background:rgba(255,255,255,.12)}
.bar button.on{background:var(--etiq);border-color:var(--etiq)}
.bar button:disabled{opacity:.35;cursor:default;background:transparent}
/* bandeau (20/10/2026, comme le site de maths) : Sommaire et titre · ◀ ceinture de la leçon ▶ · classe, accès enseignant, impression */
.bar-centre{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;min-width:0}
.bar-lecon{display:inline-flex;align-items:center;gap:.45rem;background:#fff;color:var(--ink);border-radius:999px;padding:.2rem .85rem;font-size:.9rem;min-width:0;max-width:36rem}
.bar-lecon:empty{display:none}
.bar-lecon b{white-space:nowrap}.bar-lecon span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-lecon i{width:.85rem;height:.85rem;border-radius:50%;border:1px solid #9aa3b5;flex:none}
.bar-etat{font-size:.9rem;text-align:center}
.bar-niv{display:inline-flex;border:1.5px solid rgba(255,255,255,.55);border-radius:.5rem;overflow:hidden}
.bar .bar-niv button{border:0;border-radius:0;padding:.3rem .7rem}
.bar .bar-niv button[aria-pressed="true"]{background:var(--etiq)}
body.au-sommaire #prec,body.au-sommaire #suiv,body.au-sommaire #barLecon{display:none}
body:not(.au-sommaire) #barEtat{display:none}
@media (max-width:760px){.bar h1{display:none}.bar-centre{order:3;flex-basis:100%}.bar-lecon span{display:none}}
#ensDlg{border:0;border-radius:14px;padding:20px 24px;max-width:min(24rem,92vw);box-shadow:0 18px 50px rgba(20,30,60,.3);font-family:var(--font);color:var(--ink)}
#ensDlg::backdrop{background:rgba(20,30,60,.45)}#ensDlg h2{margin:0 0 .4rem;font-size:1.25rem}#ensDlg p{margin:0 0 .7rem;line-height:1.4}
#ensDlg label{display:block;font-weight:700;margin-bottom:.3rem}#ensMdp{width:100%;box-sizing:border-box;font:inherit;font-size:1.15rem;padding:.4rem .6rem;border:2px solid #b9c2d4;border-radius:10px}
#ensMsg{min-height:1.4em;color:#b3261e;font-weight:700}
.ens-actions{display:flex;justify-content:flex-end;gap:.6rem}
.ens-actions button{font:inherit;font-weight:700;border-radius:10px;padding:.45rem 1rem;cursor:pointer;background:#fff;color:var(--ink);border:2px solid #b9c2d4}
.ens-actions button#ensOk{background:var(--ink);color:#fff;border-color:var(--ink)}
@media print{#ensDlg{display:none}}
.nouveau{display:inline-block;margin-left:.4rem;background:var(--etiq);color:#fff;border-radius:999px;padding:0 .5rem;font-size:.72rem;font-weight:700;vertical-align:middle}
.ferme-msg{max-width:34rem;margin:3rem auto;text-align:center;font-size:1.15rem;line-height:1.5}
.ferme-msg .gros{font-size:3rem;display:block}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + .4rem);background:#fff;color:var(--ink);border-radius:.6rem;box-shadow:0 8px 24px rgba(20,30,60,.25);padding:.4rem;min-width:16rem;display:none}
.menu-list.open{display:block}
.menu-list button{display:block;width:100%;text-align:left;border:0;color:var(--ink);padding:.5rem .7rem;border-radius:.4rem;font-size:.92rem}
.menu-list button:hover{background:#eef1f6}

main{max-width:60rem;margin:1.2rem auto 3rem;padding:0 .8rem}
.sheet{position:relative;background-color:var(--paper);
  background-image:linear-gradient(to right,transparent 3.4rem,var(--margin) 3.4rem,var(--margin) calc(3.4rem + 2px),transparent calc(3.4rem + 2px)),
  repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--seyes-big) 31px,var(--seyes-big) 32px),
  repeating-linear-gradient(to bottom,transparent 0,transparent 7px,var(--seyes-small) 7px,var(--seyes-small) 8px);
  border-radius:.3rem;box-shadow:0 2px 0 #d4dae6,0 10px 30px rgba(30,42,68,.12);padding:1.6rem 1.6rem 2.4rem 4.6rem;min-height:70vh}
.sheet + .sheet{margin-top:1.5rem}
.crumbs{display:none}
.crumbs a{color:var(--soft)}

/* En-tête d'une trace */
.head{display:flex;gap:1rem;align-items:center;margin-bottom:1.2rem}
.belt{flex:none;width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;color:var(--ink);border:3px solid rgba(31,42,68,.35);background:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.head h2{margin:0;font-size:2rem;line-height:1.15;color:var(--fam)}
.head .meta{font-size:.85rem;color:var(--soft)}

/* Encadrés */
.box{position:relative;background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:.7rem;padding:.7rem 1rem .5rem;margin:0 0 1rem}
.box h4{margin:0 0 .4rem;font-size:1.05rem}
.box p{margin:.3rem 0}
.box ol{margin:.3rem 0 .4rem;padding-left:1.4rem}
.box.regle{border-color:var(--fam)}
.box.regle h4{color:var(--fam)}
.box.cm1{border-color:var(--fam);border-width:3px;background:#fff}
.box.cm1 h4{color:var(--fam)}
.box.methode{border-color:#23845a;border-style:dashed}
.box.methode h4{color:#23845a}
.box.attention{border-color:#c62828;background:#fff7f6}
.box.attention h4{color:#c62828}
.box.rappel{border-color:var(--line);background:#f6f8fb}
.box.rappel h4{color:var(--soft)}
.ex{background:#f3f5f9;border-left:4px solid var(--line);padding:.35rem .7rem;border-radius:0 .4rem .4rem 0;font-size:1.02rem}
h3.sub{margin:1.6rem 0 .6rem;color:var(--fam);font-size:1.2rem}

/* Code couleur */
.s{color:var(--sujet);font-weight:700;text-decoration:underline;text-decoration-color:var(--sujet);text-underline-offset:3px}
.v{color:var(--verbe);font-weight:700}
.t{color:var(--term);font-weight:700}
.et{color:var(--etiq);font-weight:700}
.pr{color:var(--precis);font-weight:700}
/* G6 : compléments d'objet (~…~) en indigo, compléments circonstanciels (^…^) en marron, pour ne pas reprendre le vert de l'adjectif ni l'orange du déterminant (choix de l'enseignante, 23/10/2026) */
.lecon-G6{--precis:#5e35b1;--precis-bg:#f3effc;--etiq:#8d5524;--etiq-bg:#faf3ec}
.barre{text-decoration:line-through;text-decoration-thickness:2px;color:#8a92a6}
.neg{border:2px solid var(--verbe);border-radius:.9rem;padding:0 .3rem;color:var(--verbe)}
.ind{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#23845a;text-underline-offset:4px}
.motc{border:2px solid #23845a;border-radius:1rem;padding:0 .2rem}

.tab{border-collapse:collapse;margin:.4rem 0 .6rem;width:100%;background:#fff}
.tab th,.tab td{border:1.5px solid var(--line);padding:.3rem .6rem;text-align:left;vertical-align:top}
.tab th{background:#f3f5f9}
.tab.small td{font-size:.92rem}
.tabwrap{overflow-x:auto}

.label-demo{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.tag{border:2px solid;border-radius:1rem;padding:0 .7rem;background:#fff}
.tag.et{border-color:var(--etiq);background:var(--etiq-bg)}
.tag.pr{border-color:var(--precis);background:var(--precis-bg)}
.ladder{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-weight:700;font-size:1.1rem;margin:.4rem 0}

/* Carte mentale C1 */
.mind{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start;margin-bottom:1rem}
.mind-center{grid-column:1/-1;justify-self:center;background:var(--fam);color:#fff;font-weight:700;font-size:1.3rem;padding:.4rem 1.4rem;border-radius:2rem}
.mind .box{margin:0}
@media (max-width:700px){.mind{grid-template-columns:1fr}}

/* Tableau de conjugaison */
.conj{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.6rem}
.verb{background:#fff;border:1.5px solid var(--line);border-radius:.5rem;padding:.35rem .6rem;font-size:.92rem;line-height:1.4}
.verb b{display:block;color:var(--fam);font-size:1rem;border-bottom:1.5px solid var(--line);margin-bottom:.2rem}

/* Sommaire */
.toc-title{margin:0 0 .3rem;font-size:2.1rem;color:var(--ink)}
.intro{color:var(--soft);margin:0 0 1.2rem;font-size:.95rem}
.niveaux{display:flex;gap:.6rem;flex-wrap:wrap;margin:0 0 1.4rem}
.niveaux a{flex:1 1 0;min-width:0;text-align:center;text-decoration:none;font-weight:700;font-size:1.25rem;padding:.65rem 1rem;border-radius:1rem;border:3px solid #2456a6;color:#2456a6;background:#fff}
.niveaux a.on{background:#2456a6;color:#fff}
.niveaux a small{display:block;font-weight:500;font-size:.75rem;opacity:.85}
.avenir{padding:1.4rem;border:2px dashed #b8c2d6;border-radius:1rem;color:var(--soft);text-align:center;font-size:1.05rem}
.fam{margin:1.4rem 0 .4rem}
.fam h3{display:flex;align-items:baseline;gap:.6rem;margin:0 0 .6rem;font-size:1.35rem;color:var(--c)}
.fam h3 small{font-size:.8rem;color:var(--soft);font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.6rem}
.tile{display:flex;gap:.7rem;align-items:center;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--c);border-radius:.7rem;padding:.5rem .7rem;min-height:3.6rem}
a.tile:hover{background:#f6f8fb}
.tile .belt{width:2.5rem;height:2.5rem;font-size:.9rem;border-width:2.5px}
.tile .name{font-weight:700;line-height:1.2}
.tile .state{display:block;font-size:.75rem;color:var(--soft);font-weight:400}
.tile.todo{border-style:dashed;border-color:#c5cbd8;color:var(--soft)}
.tile.todo .belt{opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:.7rem;padding:.6rem 1rem;margin-top:2rem;font-size:.92rem}
.legend strong{width:100%;color:var(--soft);font-size:.85rem}

.todo-note{color:var(--soft);font-style:italic}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.8rem;margin-top:1.8rem;padding-top:1rem;border-top:2px dashed var(--line)}
.nb{display:flex;align-items:center;gap:.7rem;text-decoration:none;border-radius:.9rem;padding:.55rem 1.1rem;border:2px solid var(--fam);background:#fff;color:var(--fam);min-width:0;max-width:100%;transition:transform .12s,box-shadow .12s}
.nb:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,42,68,.14)}
.nb-prec{justify-self:start}
.nb-suiv{justify-self:end;background:var(--fam);color:#fff;text-align:right}
.nb-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nb-t b{font-size:1.15rem;font-weight:600}
.nb-t small{font-size:.8rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:15rem}
.nb-fl{font-size:1.2rem;line-height:1}
.nb-carte{justify-self:center;border:1.5px solid var(--line);color:var(--soft);padding:.45rem .9rem;font-size:.95rem;gap:.4rem}
.nb-carte:hover{color:var(--fam);border-color:var(--fam)}
@media (max-width:640px){.nav{grid-template-columns:1fr 1fr}.nb-carte{grid-column:1/-1;order:3}}

/* Édition */
.edit-bar{display:none;position:sticky;top:calc(3.1rem + env(safe-area-inset-top,0px));z-index:4;flex-wrap:wrap;gap:.35rem;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:.6rem;padding:.45rem .6rem;margin:0 0 1rem;box-shadow:0 4px 14px rgba(20,30,60,.1)}
body.editing .edit-bar{display:flex}
.edit-bar span.lbl{font-size:.8rem;color:var(--soft);margin-right:.2rem}
.edit-bar button{border:1.5px solid var(--line);background:#fff;border-radius:.4rem;padding:.1rem .55rem;font-size:.85rem;cursor:pointer}
.edit-bar button:hover{background:#f3f5f9}
.edit-bar .sep{width:1px;height:1.4rem;background:var(--line);margin:0 .2rem}
body.editing .body[contenteditable]{outline:2px dashed var(--etiq);outline-offset:6px;border-radius:.3rem}
.modified{font-size:.75rem;background:var(--etiq-bg);color:var(--etiq);border-radius:.3rem;padding:0 .4rem;margin-left:.4rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1rem;border-radius:.5rem;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}


/* ===== Leçon interactive G1 ===== */
[hidden]{display:none!important}
.map{position:relative;border-radius:.6rem;overflow:hidden;box-shadow:0 2px 10px rgba(30,42,68,.12);background:#fff}
.map img{display:block;width:100%;height:auto}
.map,.mapw{container-type:inline-size}
.mapw{position:relative}
.masque{position:absolute;background:rgba(255,255,255,.72);border-radius:1.4rem;pointer-events:none}
.chip2{position:absolute;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:.18cqw solid #3b7dd8;background:#eaf2fd;color:#1f4f9c;border-radius:1.15cqw;font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-weight:500;line-height:1;white-space:nowrap;pointer-events:none}
.chip2.main{border:0;background:#fefefe;color:#1f2a44;font-family:"Comic Sans MS","Comic Neue",cursive;font-weight:400}
.cm2-box{border:2.5px solid #2456a6;border-radius:.9rem;background:#eef4fd;padding:.6rem 1.1rem;margin:0 0 1rem}
.cm2-box h3{margin:0 0 .3rem;color:#2456a6;font-size:1.1rem}
.cm2-box ul{margin:0;padding-left:1.2rem;line-height:1.5}
.cm2-box.ce2{border-color:#1e8a5a;background:#ecf7f1}.cm2-box.ce2 h3{color:#1e8a5a}.tag-cm2.ce2{background:#1e8a5a}
.tag-cm2{display:inline-block;vertical-align:middle;margin-left:.6rem;font-size:.8rem;font-weight:700;color:#fff;background:#2456a6;border-radius:.5rem;padding:.1rem .5rem}
.chip2.nu{border:0;border-radius:.3cqw;background:rgb(208,237,251);color:#1f2a44}
.zone{position:absolute;border-radius:1rem;border:3px solid transparent;transition:border-color .2s,background .2s}
.zone:hover,.zone:focus-visible{border-color:var(--z);background:color-mix(in srgb,var(--z) 8%,transparent);outline:0}
.num{display:inline-grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--z);color:#fff;font-weight:700;font-size:1.05rem;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.zone .num{position:absolute;right:-.3rem;top:-.3rem}
.num.done{background:#23845a}
.map-path{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem;margin-top:1rem}
.map-path a{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--ink);font-weight:700;background:#fff;border:2px solid var(--z);border-radius:2rem;padding:.2rem .9rem .2rem .25rem}
.map-path a:hover{background:#f6f8fb}
.map-path .arrow{color:var(--soft);font-size:1.4rem}

.scr-head{display:flex;align-items:center;gap:.8rem;margin:.2rem 0 1rem}
.picto{flex:none;width:3.4rem;height:3.4rem;border-radius:.9rem;display:grid;place-items:center;background:color-mix(in srgb,var(--z) 12%,#fff);color:var(--z);border:2.5px solid var(--z)}
.picto svg{width:2.4rem;height:2.4rem}
.scr-head h2{margin:0;font-size:1.9rem;line-height:1.15;color:var(--z)}
.dots{margin-left:auto;display:flex;gap:.35rem}
.dots a{width:.85rem;height:.85rem;border-radius:50%;border:2px solid var(--z);background:#fff}
.dots a.ok{background:var(--z)}
.dots a.cur{outline:2px solid var(--ink);outline-offset:2px}

.guide{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.guide img{width:4.6rem;height:4.6rem;border-radius:50%;border:3px solid var(--z);background:#fff;object-fit:cover;flex:none}
.guide img.duo{width:7.5rem;height:4rem;border-radius:1.2rem}
.bubble{position:relative;margin:0;background:#fff;border:2.5px solid var(--z);border-radius:1.1rem;padding:.5rem 1rem;font-weight:700;font-size:1.15rem}
.bubble::before{content:"";position:absolute;left:-.75rem;top:50%;transform:translateY(-50%);border:.6rem solid transparent;border-right-color:var(--z);border-left:0}

.stage{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:1.4rem 1rem 1rem;text-align:center;cursor:pointer;min-height:9.5rem;display:flex;flex-direction:column;justify-content:center}
.phrase{font-size:2rem;line-height:1.5;margin:0;font-weight:400}
.phrase .s,.phrase .v{display:inline-block}
.cap{margin:.6rem auto 0;font-size:1.1rem;color:var(--soft);min-height:1.6rem;opacity:0;transition:opacity .3s}
.cap.on{opacity:1;color:var(--ink);font-weight:700}
.stage-ctl{display:flex;align-items:center;justify-content:space-between;margin:.6rem 0 1.2rem;gap:1rem}
.sdots{display:flex;gap:.3rem}
.sdots span{width:1.6rem;height:.35rem;border-radius:.2rem;background:var(--line)}
.sdots span.on{background:var(--z)}
.btn{display:inline-block;border:0;border-radius:.6rem;padding:.5rem 1.2rem;font-weight:700;font-size:1.05rem;cursor:pointer;text-decoration:none}
.btn.go{background:var(--z);color:#fff}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}

.struck{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#8a92a6;color:#9aa1b2}
.strike{color:inherit;background:linear-gradient(#c62828,#c62828) no-repeat 0 58%/0% 3px;animation:strike .7s .15s forwards}
@keyframes strike{to{background-size:100% 3px;color:#9aa1b2}}
.pop{display:inline-block;animation:pop .55s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.leave{animation:leave .9s forwards}
@keyframes leave{to{opacity:.2;transform:scale(.85)}}
.wagon{border:3px solid var(--sujet);background:#e7effb;border-radius:.6rem .6rem .3rem .3rem;padding:0 .5rem;position:relative;text-decoration:none;margin-bottom:.6rem}
.wagon::after{content:"";position:absolute;left:12%;right:12%;bottom:-.9rem;height:.9rem;background:radial-gradient(circle,var(--sujet) 60%,transparent 64%) left/.9rem .9rem no-repeat,radial-gradient(circle,var(--sujet) 60%,transparent 64%) right/.9rem .9rem no-repeat}

.atoi{border:3px solid var(--z);border-radius:1rem;background:color-mix(in srgb,var(--z) 6%,#fff);padding:.8rem 1rem 1rem;text-align:center;margin-bottom:.5rem}
.atoi h3{margin:0;color:var(--z);font-size:1.4rem}
.atoi .ex-num{font-size:.95rem;color:var(--soft);font-weight:400}
.ask{margin:.2rem 0 .8rem;font-size:1.15rem}
.tokens{font-size:1.8rem}
.tk{font:inherit;border:0;background:#fff;border-bottom:2px dashed #b6bdcc;border-radius:.3rem;padding:0 .15rem;cursor:pointer;color:var(--ink)}
.tk:hover{background:#eef1f6}
.tk.s{color:var(--sujet);font-weight:700;border-bottom:3px solid var(--sujet)}
.tk.v{color:var(--verbe);font-weight:700;border-bottom-color:transparent}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{min-height:1.6rem;margin:.6rem 0 0;font-weight:700}
.fb.good{color:#23845a}.fb.bad{color:#b3261e}

/* ---------- Moteur ---------- */
const PROG={};
const progKey=id=>id==='G1'?'g1-lecon-reussi':'lecon-reussi-'+id;
function prog(id){ if(!PROG[id]){try{PROG[id]=JSON.parse(localStorage.getItem(progKey(id))||'{}')||{};}catch(e){PROG[id]={};}} return PROG[id]; }
function progSave(id){try{localStorage.setItem(progKey(id),JSON.stringify(PROG[id]));}catch(e){}}

function popIn(s){return esc(s).replace(/\*([^*]+)\*/g,'<span class="pop">$1</span>');}
function inline(s){ // marques simples à l'intérieur d'un morceau
  const pop=/^\*.*\*$/.test(s); return {pop, h: pop?esc(s.slice(1,-1)):popIn(s)};
}
function phraseHTML(p){
  const re=/\{\{([^}]+)\}\}|\{([^}]+)\}|\[([^\]]+)\]|\(([^)]+)\)|\^([^^]+)\^|~([^~]+)~|%([^%]+)%|#([^#]+)#|\|([^|]+)\||§([^§]+)§|(___)|(\s*\/\s*)|([^[\](){}^~%#|_/§]+|_)/g;
  return p.replace(re,(m,old,nw,s,v,et,pr,ind,inc,circ,term,blank,br,plain)=>{
    if(old!=null) return `<span class="struck">${popIn(old.replace(/[\[\]]/g,''))}</span>`;
    if(nw!=null){ if(/^\[.*\]$/.test(nw)) return `<span class="strike"><span class="s">${esc(nw.slice(1,-1))}</span></span>`; return `<span class="strike">${popIn(nw)}</span>`;}

function atoiTokens(p){
  const out=[];
  p.replace(/\[([^\]]+)\]|\(([^)]+)\)|<([^>]+)>|(___)|([^[\]()<>]+?(?=___|[[\]()<>]|$))/g,(m,s,v,x,blank,plain)=>{
    if(s!=null) out.push({t:s,r:'s'}); else if(v!=null) out.push({t:v,r:'v'}); else if(x!=null) out.push({t:x,r:'x'});
    else if(blank!=null) out.push({blank:true});
    else if(plain) plain.split(/(\s+)/).forEach(w=>{ if(!w) return; if(/^\s+$/.test(w)) out.push({sp:w}); else out.push({t:w,r:''}); });
  });
  return out;
}

let OUVERTURE_REELLE=null;   /* ouvertures.json : {maj, CE2:{code:date}, CM1:{…}, CM2:{…}} */

const AUJ=isoJour(new Date());
const dateOuverture=t=>{const n=niveauDe(t),c=code(t);return ((OUVERTURE_REELLE||{})[n]||{})[c]||(OUVERTURE_PREVUE[n]||{})[c]||'';};
const ouverte=t=>{if(ENSEIGNANT)return true;const d=dateOuverture(t);return !!d&&d<=AUJ;};
const nouvelle=t=>{const d=dateOuverture(t);return !ENSEIGNANT&&!!d&&d<=AUJ&&(new Date(AUJ)-new Date(d))/864e5<7;};
const dateLongue=iso=>new Date(iso+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const visibleTrace=t=>hasTrace(t)&&ouverte(t);

function belt(t){
  const bg=t.ceinture?BELT[t.ceinture]:'#fff';
  const dark=['Bleue','Violette','Marron','Verte'].includes(t.ceinture);
  return `<span class="belt" style="background:${bg};${dark?'color:#fff;':''}" title="${t.ceinture?'Ceinture '+esc(t.ceinture):''}">${esc(code(t))}</span>`;
}
function renderConj(root){
  root.querySelectorAll('.conj[data-verbs]').forEach(el=>{
    const P=['je','tu','il, elle','nous','vous','ils, elles'];
    el.innerHTML=el.dataset.verbs.split(';').map(v=>{
      const [inf,forms]=v.split('|');
      const lines=forms.split(',').map((f,i)=>{
        let pro=P[i]; const plain=f.replace('·','');
        if(i===0&&/^[aeiouyéèh]/i.test(plain)) pro="j'"; else pro+=' ';
        const w=f.includes('·')?f.split('·')[0]+'<span class="t">'+f.split('·')[1]+'</span>':'<b style="display:inline;border:0;color:inherit;font-size:inherit;margin:0">'+f+'</b>';
        return pro+w;
      }).join('<br>');
      return `<div class="verb"><b>${inf}</b>${lines}</div>`;
    }).join('');
    el.removeAttribute('data-verbs');
  });
}

/* ---------- Sommaire ---------- */
const NIVEAUX=['CE2','CM1','CM2'];
const niveauDe=t=>t.niveau||'CM1'; /* toutes les leçons actuelles sont de CM1 */
function niveauChoisi(){const m=location.hash.match(/^#niveau=(CE2|CM1|CM2)$/);if(m){try{localStorage.setItem('niveau',m[1]);}catch(e){}return m[1];}
  try{const v=localStorage.getItem('niveau');if(NIVEAUX.includes(v))return v;}catch(e){}return 'CM1';}
function renderToc(){
  const niv=niveauChoisi();
  document.title='Leçons interactives — ceintures de français '+niv;
  document.body.style.removeProperty('--fam');
  main.innerHTML=`<div class="sheet">
  <h2 class="toc-title">Sommaire</h2>
  <p class="intro">Les leçons de chaque ceinture, à relire avant l'entraînement ou le test.</p>
  <nav class="niveaux" aria-label="Choisir sa classe">${NIVEAUX.map(n=>{const k=TRACES.filter(t=>t.lesson&&niveauDe(t)===n).length;return `<a href="#niveau=${n}" class="${n===niv?'on':''}"${n===niv?' aria-current="page"':''}>${n}<small>${k?k+' leçons':'à venir'}</small></a>`;}).join('')}</nav>
  ${!TRACES.some(t=>niveauDe(t)===niv)?`<p class="avenir">Les leçons de ${niv} arrivent bientôt.</p>`:''}
  ${FAMILLES.filter(f=>TRACES.some(t=>t.f===f.id&&niveauDe(t)===niv)).map(f=>`<section class="fam" style="--c:${f.couleur}">
    <h3>${esc(f.nom)}</h3>
    <div class="tiles">${TRACES.filter(t=>t.f===f.id&&niveauDe(t)===niv).sort((a,b)=>code(a).localeCompare(code(b),'fr',{numeric:true})).map(t=>{
      const open=ouverte(t), ok=hasTrace(t)&&open;
      if(!ok){const d=hasTrace(t)&&dateOuverture(t);return `<span class="tile todo" style="--c:${f.couleur}">${belt(t)}<span class="name">${esc(t.titre)}<span class="state">${d?"s'ouvrira le "+dateLongue(d):'à venir'}</span></span></span>`;}
      const st=t.lesson?'leçon interactive':ok?(edits[t.id]!=null?'modifiée':''):'à venir';
      return `<a class="tile${ok?'':' todo'}" href="#t=${t.id}" style="--c:${f.couleur}">${belt(t)}<span class="name">${esc(t.titre)}${nouvelle(t)?'<span class="nouveau">nouveau</span>':''}<span class="state">${st}</span></span></a>`;
    }).join('')}</div></section>`).join('')}
  <div class="legend"><strong>Le code couleur</strong>
    <span><span class="s">sujet</span></span><span><span class="v">verbe</span></span><span>radical + <span class="t">terminaison</span></span>
    <span><span class="et">mot-étiquette</span></span><span><span class="pr">mots précis</span></span><span><span class="hl">lettres étudiées</span></span><span><span class="circ">lettre qui décide</span></span></div>
  </div>`;
}

/* ---------- Page d'une trace ---------- */
function traceSheet(t,withNav){
  if(t.lesson){const f=fam(t.f);return `<div class="sheet" style="--fam:${f.couleur}"><div class="head">${belt(t)}<div><h2>${esc(t.titre)}</h2><div class="meta">${esc(f.nom)} — ceinture ${esc(code(t))} — ${esc(t.niveau||'CM1')}</div></div></div><div class="mapw"><img class="print-map" src="${IMG[t.id].carte}" alt="Carte mentale ${esc(code(t))}">${chipCM2(t)}</div>${t.html?`<div class="body">${t.html}</div>`:''}</div>`;}
  const f=fam(t.f), seq=order.filter(x=>visibleTrace(x)||x===t), i=seq.indexOf(t), prev=seq[i-1], next=seq[i+1];
  const content=htmlOf(t);
  return `<div class="sheet" style="--fam:${f.couleur}">
    <div class="crumbs"><a href="#">Sommaire</a> › ${esc(f.nom)}</div>
    <div class="head">${belt(t)}<div><h2>${esc(t.titre)}</h2><div class="meta">${esc(f.nom)} — ceinture ${esc(t.id)}${t.ceinture?' ('+esc(t.ceinture.toLowerCase())+')':''}${t.sous?' · '+esc(t.sous):''}${withNav&&edits[t.id]!=null?'<span class="modified no-print">modifiée</span>':''}</div></div></div>
    ${withNav?`<div class="edit-bar" id="ebar">
      <span class="lbl">Colorer la sélection :</span>
      <button data-w="s" type="button"><span class="s">sujet</span></button>
      <button data-w="v" type="button"><span class="v">verbe</span></button>
      <button data-w="t" type="button"><span class="t">terminaison</span></button>
      <button data-w="et" type="button"><span class="et">étiquette</span></button>
      <button data-w="pr" type="button"><span class="pr">précis</span></button>
      <button data-w="barre" type="button"><span class="barre">barré</span></button>
      <button data-w="neg" type="button">entouré</button>
      <button data-w="ind" type="button"><span class="ind">indice</span></button>
      <span class="sep"></span>
      <button data-cmd="bold" type="button"><b>G</b></button>
      <button data-w="clear" type="button">Enlever la couleur</button>
      <span class="sep"></span>
      <button data-box="regle" type="button">+ encadré</button>
      <button data-box="attention" type="button">+ Attention !</button>
      <button data-box="ex" type="button">+ exemple</button>
      <span class="sep"></span>
      <button id="resetT" type="button">Version d'origine</button>
    </div>`:''}
    ${content.trim()?`<div class="body">${content}</div>`:
      `<div class="body"><div class="box rappel"><h4>Trace à venir</h4><p>${esc(t.obj||'')}</p></div></div>`}
    ${withNav?navBar(prev?{href:`#t=${prev.id}`,top:'Leçon précédente',sub:`${prev.id} — ${prev.titre}`}:null,{href:'#',ico:'📚',top:'Sommaire'},next?{href:`#t=${next.id}`,top:'Leçon suivante',sub:`${next.id} — ${next.titre}`}:null):''}
  </div>`;
}
function renderTrace(t,scr){
  if(t.lesson){ if(scr!=null&&LESSONS[t.id].ecrans[scr]) renderLessonScreen(t,scr); else renderLessonMap(t); return; }
  document.title=t.id+' — '+t.titre;
  main.innerHTML=traceSheet(t,true);
  renderConj(main);
  const body=main.querySelector('.body');
  if(editing) body.setAttribute('contenteditable','true');
  let st;
  body.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>{edits[t.id]=body.innerHTML;save();},400);});
  $('#ebar').addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
  $('#ebar').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.id==='resetT'){
      if(edits[t.id]==null){toast("Cette trace n'a pas été modifiée.");return;}
      if(!confirm(`Revenir à la version d'origine de ${t.id} ? Vos modifications seront perdues.`)) return;
      delete edits[t.id];save();renderTrace(t);toast("Version d'origine rétablie.");return;
    }
    if(b.dataset.cmd){document.execCommand(b.dataset.cmd);body.dispatchEvent(new Event('input'));return;}
    if(b.dataset.box){insertBox(body,b.dataset.box);body.dispatchEvent(new Event('input'));return;}
    if(b.dataset.w){wrap(body,b.dataset.w);body.dispatchEvent(new Event('input'));}
  });
}
function selIn(body){const s=getSelection();if(!s.rangeCount)return null;const r=s.getRangeAt(0);return body.contains(r.commonAncestorContainer)?r:null;}
const MARKS=['s','v','t','et','pr','barre','neg','ind','motc'];
function wrap(body,cls){
  const r=selIn(body); if(!r){toast('Sélectionnez d’abord des mots dans la trace.');return;}
  if(cls==='clear'){
    let n=r.commonAncestorContainer; if(n.nodeType===3) n=n.parentNode;
    const spans=new Set();
    body.querySelectorAll('span').forEach(sp=>{ if(MARKS.some(m=>sp.classList.contains(m))&&r.intersectsNode(sp)) spans.add(sp); });
    let p=n; while(p&&p!==body){ if(p.tagName==='SPAN'&&MARKS.some(m=>p.classList.contains(m))) spans.add(p); p=p.parentNode; }
    spans.forEach(sp=>{sp.replaceWith(...sp.childNodes);});
    return;
  }
  if(r.collapsed){toast('Sélectionnez d’abord des mots dans la trace.');return;}
  const sp=document.createElement('span');sp.className=cls;
  sp.appendChild(r.extractContents());r.insertNode(sp);
  getSelection().removeAllRanges();
}
function insertBox(body,kind){
  const el=document.createElement(kind==='ex'?'p':'div');
  if(kind==='ex'){el.className='ex';el.textContent='Écrivez un exemple ici.';}
  else{el.className='box '+kind;el.innerHTML=kind==='attention'?'<h4>Attention !</h4><p>Écrivez ici.</p>':'<h4>Titre de l’encadré</h4><p>Écrivez ici.</p>';}
  const r=selIn(body);
  let anchor=r?r.startContainer:null; while(anchor&&anchor.parentNode!==body) anchor=anchor.parentNode;
  if(kind==='ex'&&r){let a=r.startContainer;while(a&&!(a.classList&&a.classList.contains('box')))a=a.parentNode;
    if(a){let c=r.startContainer;while(c.parentNode!==a)c=c.parentNode;c.after(el);}else if(anchor)anchor.after(el);else body.appendChild(el);}
  else if(anchor) anchor.after(el); else body.appendChild(el);
  const rg=document.createRange();rg.selectNodeContents(el.querySelector('p')||el);const s=getSelection();s.removeAllRanges();s.addRange(rg);
}

function renderAll(){
  document.title='Traces écrites — toutes les ceintures';
  const list=order.filter(t=>visibleTrace(t)&&niveauDe(t)===niveauChoisi());
  main.innerHTML=`<div class="sheet no-print" style="min-height:0"><div class="crumbs"><a href="#">Sommaire</a></div><p>${list.length} traces prêtes à imprimer, une par page. Les traces à venir ne sont pas imprimées.</p></div>`+list.map(t=>traceSheet(t,false)).join('');
  renderConj(main);
}

/* ---------- Routage ---------- */
/* leçons ouvertes de la classe, dans l'ordre du sommaire (◀ ▶ du bandeau) */
const ordreSommaire=n=>FAMILLES.flatMap(f=>TRACES.filter(t=>t.f===f.id&&niveauDe(t)===n).sort((a,b)=>code(a).localeCompare(code(b),'fr',{numeric:true})));
const parcours=n=>ordreSommaire(n).filter(visibleTrace);
/* adresse #G1 (lien du tableau de bord vers une ceinture) : la leçon de ce code pour la classe choisie */
function leconDuCode(c,n){return TRACES.find(t=>code(t)===c&&niveauDe(t)===n)||TRACES.find(t=>t.id===c);}
function majBandeau(t){const n=t?niveauDe(t):niveauChoisi(),som=!t;
  document.body.classList.toggle('au-sommaire',som);$('#tocBtn').disabled=som&&!location.hash.startsWith('#t=');
  document.querySelectorAll('.bar-niv [data-classe]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.classe===n)));
  if(som){const C=TRACES.filter(x=>hasTrace(x)&&niveauDe(x)===n),k=C.filter(ouverte).length;
    $('#barEtat').textContent=ENSEIGNANT?`Accès enseignant : les ${C.length} leçons de ${n} sont ouvertes`
     :`🔓 ${k} leçon${k>1?'s':''} ouverte${k>1?'s':''} sur ${C.length}`+(OUVERTURE_REELLE&&OUVERTURE_REELLE.maj?` · progression de la classe au ${new Date(OUVERTURE_REELLE.maj+'T12:00').toLocaleDateString('fr-FR')}`:'');return;}
  const dark=['Bleue','Violette','Marron','Verte','Noire'].includes(t.ceinture);
  $('#barLecon').innerHTML=`<i style="background:${t.ceinture?BELT[t.ceinture]:'#fff'}"></i><b>${esc(code(t))}</b><span>· ${esc(t.titre)}</span>`;
  const P=parcours(n),i=P.indexOf(t);$('#prec').disabled=i<=0;$('#suiv').disabled=i<0||i>=P.length-1;}
function render(){
  const h=location.hash;
  if(h==='#tout'){renderAll();majBandeau(null);return;}
  /* lien du tableau de bord : « #G1 » (classe choisie) ou « #G1&niveau=CE2 » ; une ceinture absente de la classe choisie ouvre celle d'une autre classe (21/10/2026) */
  const m=h.match(/^#([A-Z]\d+)(?:&niveau=(CE2|CM1|CM2))?$/);if(m){const n=niveauChoisi(),t=leconDuCode(m[1],m[2]||n)||leconDuCode(m[1],n)||TRACES.find(x=>code(x)===m[1]&&hasTrace(x));if(t){location.replace('#t='+t.id);return;}}
  if(h.startsWith('#t=')){const [id,sc]=decodeURIComponent(h.slice(3)).split('/');const t=byId(id);
    if(t&&ouverte(t)){try{localStorage.setItem('niveau',niveauDe(t));}catch(e){}renderTrace(t,sc!=null?+sc:null);majBandeau(t);scrollTo(0,0);return;}
    if(t){const d=dateOuverture(t);document.title=code(t)+' — '+t.titre;
      main.innerHTML=`<div class="sheet" style="min-height:0"><div class="ferme-msg"><span class="gros">🔒</span>Cette leçon n'est pas encore ouverte${d?` : elle s'ouvrira le <b>${dateLongue(d)}</b>`:''}.<br><a href="#">Revenir au sommaire</a></div></div>`;
      majBandeau(null);scrollTo(0,0);return;}}
  renderToc();majBandeau(null);
}
window.addEventListener('hashchange',render);
function go(h){if(location.hash===h)render();else location.hash=h;}

/* ---------- Barre ---------- */
function setEditing(on){
  editing=on;document.body.classList.toggle('editing',on);
  const b=$('#editBtn');b.classList.toggle('on',on);b.textContent=on?'Terminer':'Modifier';b.setAttribute('aria-pressed',on);
  const body=main.querySelector('.sheet .body');
  const cur=byId((location.hash.match(/^#t=([A-Z]\d+(?:-CM2)?)/)||[])[1]);
  if(on&&cur&&cur.lesson){toast('Les leçons interactives ne se modifient pas ici.');}
  if(!location.hash.startsWith('#t=')) render();
  if(location.hash.startsWith('#t=')&&body){ if(on) body.setAttribute('contenteditable','true'); else {body.removeAttribute('contenteditable');render();} }
  else if(on&&!(cur&&cur.lesson)) toast('Ouvrez une trace pour la modifier.');
}
$('#home').addEventListener('click',()=>go('#'));
const allerA=k=>{const cur=byId((decodeURIComponent(location.hash).match(/^#t=([^/]+)/)||[])[1]);if(!cur)return;const P=parcours(niveauDe(cur)),i=P.indexOf(cur);if(i>=0&&P[i+k])go('#t='+P[i+k].id);};
$('#prec').addEventListener('click',()=>allerA(-1));$('#suiv').addEventListener('click',()=>allerA(1));
/* classe choisie dans le bandeau : sommaire de la classe ; sur une leçon, la leçon du même code dans cette classe si elle est ouverte */
document.querySelectorAll('.bar-niv [data-classe]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.classe;try{localStorage.setItem('niveau',n);}catch(e){}
  const cur=byId((decodeURIComponent(location.hash).match(/^#t=([^/]+)/)||[])[1]),t=cur&&TRACES.find(x=>code(x)===code(cur)&&niveauDe(x)===n);
  if(t&&ouverte(t))go('#t='+t.id);else go('#niveau='+n);}));
/* bouton 🔑 : mot de passe → toutes les leçons ouvertes jusqu'à la fermeture de l'onglet ; en mode enseignant, il permet d'en sortir */
(()=>{const b=$('#ensBtn');if(ENSEIGNANT){b.textContent='🔑 Enseignant';b.classList.add('on');b.title='Quitter le mode enseignant';}
 const dlg=document.createElement('dialog');dlg.id='ensDlg';dlg.innerHTML=`<form method="dialog"><h2>Accès enseignant</h2><p>Toutes les leçons s'ouvrent sur cet onglet, jusqu'à ce que vous le fermiez. Rien ne change pour les élèves.</p>
  <label for="ensMdp">Mot de passe</label><input id="ensMdp" type="password" autocomplete="off"><p id="ensMsg" role="status"></p>
  <div class="ens-actions"><button value="non" formnovalidate>Annuler</button><button id="ensOk" value="ok">Ouvrir</button></div></form>`;document.body.appendChild(dlg);
 const ok=e=>{e.preventDefault();if(empreinteEns($('#ensMdp').value)===MDP_ENS){try{sessionStorage.setItem('francais-enseignant',MDP_ENS);}catch(x){}location.reload();}
  else{$('#ensMsg').textContent="Ce n'est pas le bon mot de passe.";$('#ensMdp').select();}};
 $('#ensOk').onclick=ok;$('#ensMdp').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')ok(e);});
 b.onclick=()=>{if(ENSEIGNANT){if(confirm('Quitter le mode enseignant ? Seules les leçons ouvertes resteront visibles.')){try{sessionStorage.removeItem('francais-enseignant');}catch(x){}location.reload();}return;}
  $('#ensMdp').value='';$('#ensMsg').textContent='';dlg.showModal();setTimeout(()=>$('#ensMdp').focus(),50);};})();
/* progression réelle de la classe (tableau de bord) : ouvertures.json à côté de index.html, s'il existe */
if(location.protocol!=='file:')fetch('ouvertures.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&typeof j==='object'){OUVERTURE_REELLE=j;render();}}).catch(()=>{});
$('#tocBtn').addEventListener('click',()=>go('#'));
$('#home').addEventListener('keydown',e=>{if(e.key==='Enter')go('#');});
const menuBtn=$('#menuBtn'),menuList=$('#menuList');
menuBtn.addEventListener('click',e=>{e.stopPropagation();const o=menuList.classList.toggle('open');menuBtn.setAttribute('aria-expanded',o);});
document.addEventListener('click',()=>{menuList.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');});
menuList.addEventListener('click',e=>{
  const act=e.target.dataset.act;if(!act)return;
  if(act==='print') window.print();
  if(act==='printall'){ if(editing) setEditing(false); go('#tout'); setTimeout(()=>window.print(),400); }
  if(act==='export'){
    const blob=new Blob([JSON.stringify(edits,null,1)],{type:'application/json'});
    const a=document.createElement('a');const d=new Date();
    a.href=URL.createObjectURL(blob);a.download=`traces-ecrites-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Copie de vos modifications enregistrée.');
  }
  if(act==='import') $('#fileIn').click();
});
if($('#fileIn'))$('#fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||Array.isArray(d))throw 0;
    if(!confirm('Remplacer vos modifications actuelles par cette copie ?'))return;
    edits=d;save();render();toast('Copie ouverte.');}catch(err){toast("Ce fichier n'est pas une copie des traces écrites.");}
    e.target.value='';};
  r.readAsText(f);
});
load();render();
})();
</script>
<script>
/* Agrandissement des leçons et des traces pour remplir l'écran (comme en maths) */
(function(){
 const main=document.getElementById('main'); if(!main)return;
 const MAX_LECON=1.8, MAX_TRACE=1.35;
 let raf=0;
 function fitPage(){
  main.style.zoom='';
  const s=main.querySelector('.sheet');
  if(s)s.style.minHeight='';
  if(!s||!location.hash.startsWith('#t=')||innerWidth<=760)return;
  const bar=(document.querySelector('.bar')||{offsetHeight:0}).offsetHeight;
  const w=main.getBoundingClientRect().width;
  const availW=innerWidth-32, availH=innerHeight-bar-24;
  let z=availW/w;
  if(s.classList.contains('lesson')){
    s.style.minHeight='0px';
    const cs=getComputedStyle(main);
    const h=s.getBoundingClientRect().height+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom)*0.4;
    z=Math.min(z,availH/h,MAX_LECON);
  } else z=Math.min(z,MAX_TRACE);
  z=Math.max(1,z*0.98);
  main.style.zoom=z.toFixed(3);
 }
 function later(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fitPage);}
 new MutationObserver(later).observe(main,{childList:true});
 addEventListener('resize',later); addEventListener('hashchange',later);
 addEventListener('beforeprint',()=>{main.style.zoom='';const s=main.querySelector('.sheet');if(s)s.style.minHeight='';});
 addEventListener('afterprint',later);
 later();
})();
</script>
