<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leçons interactives — ceintures de français CM1</title>
<style>
/* Police Andika (SIL, licence OFL : polices/OFL.txt), faite pour les jeunes lecteurs ; fichiers dans polices/ (plus de Google Fonts : même écriture sur tous les appareils, sans internet, sans envoyer l'adresse de l'appareil à Google, 10/11/2026) */
@font-face{font-family:"Andika";font-style:normal;font-weight:400;font-display:swap;src:url(polices/andika-400.woff2) format("woff2")}
@font-face{font-family:"Andika";font-style:italic;font-weight:400;font-display:swap;src:url(polices/andika-400-italique.woff2) format("woff2")}
@font-face{font-family:"Andika";font-style:normal;font-weight:700 900;font-display:swap;src:url(polices/andika-700.woff2) format("woff2")}
:root{
  --paper:#fff;--ink:#1f2a44;--soft:#5b6479;--line:#d8dde8;
  --sujet:#1f5fc4;--verbe:#c62828;--term:#7b3fa0;--etiq:#d9730d;--etiq-bg:#fff1e3;--precis:#23845a;--precis-bg:#e8f5ee;
  --seyes-big:#b9c9e6;--seyes-small:#e3eaf6;--margin:#e7a3a3;
  --fam:#2456a6;
  --font:"Andika","Verdana","Trebuchet MS",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:#eef1f6;color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--etiq);outline-offset:2px}

/* bandeau (08/11/2026, refait : clair, arrondi, aux couleurs des cinq familles ; nom et photo de l'école réglables par l'enseignante) */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;padding:.55rem 1rem .7rem;background:rgba(255,255,255,.93);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);color:var(--ink);box-shadow:0 3px 16px rgba(31,42,68,.09)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#2456a6 0 20%,#b3261e 20% 40%,#7b3fa0 40% 60%,#d9730d 60% 80%,#1e8a5a 80%)}
.bar h1{margin:0 auto 0 0;display:flex;align-items:center;gap:.65rem;min-width:0;border-radius:.9rem;padding:.1rem .5rem .1rem .1rem}
.bar .logo{width:2.7rem;height:2.7rem;border-radius:.85rem;object-fit:cover;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.bar .ecusson{display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.05rem;background:linear-gradient(135deg,#2456a6,#7b3fa0 55%,#d9730d)}
.marque-t{display:flex;flex-direction:column;line-height:1.18;min-width:0}
.marque-t small{font-size:.74rem;font-weight:700;color:var(--soft);letter-spacing:.02em;white-space:normal;overflow-wrap:anywhere;max-width:none}.marque-t small:empty{display:none}
.marque-t b{font-size:1.1rem;white-space:nowrap}
.bar button{background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:.35rem .95rem;font-size:.88rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;transition:background .15s,border-color .15s}
.bar button:hover{background:#eef3fc;border-color:#9db6e4}
.bar button.on{background:var(--etiq);border-color:var(--etiq);color:#fff}
.bar button:disabled{opacity:.35;cursor:default;background:#fff;border-color:var(--line)}
.bar button svg{width:1.05em;height:1.05em;flex:none}
.bar #prec,.bar #suiv{width:2.2rem;height:2.2rem;padding:0;justify-content:center}
.bar-centre{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;min-width:0}
.bar-lecon{display:inline-flex;align-items:center;gap:.45rem;background:#eef3fc;border:1px solid #cddcf5;color:var(--ink);border-radius:999px;padding:.25rem .9rem;font-size:.9rem;min-width:0;max-width:36rem}
.bar-lecon:empty{display:none}
.bar-lecon b{white-space:nowrap}.bar-lecon span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-lecon i{width:.85rem;height:.85rem;border-radius:50%;border:1px solid #9aa3b5;flex:none}
.bar-etat{font-size:.88rem;text-align:center;background:#eef3fc;color:#1f3d73;border-radius:999px;padding:.25rem .95rem}.bar-etat:empty{display:none}
.bar-niv{display:inline-flex;gap:2px;background:#e8ecf4;border-radius:999px;padding:3px}
.bar .bar-niv button{border:0;background:transparent;padding:.28rem .85rem}
.bar .bar-niv button:hover{background:#fff}.bar .bar-niv button[aria-pressed="true"]{background:var(--ink);color:#fff}
.bar #ensBtn,.bar #menuBtn{min-width:2.4rem;justify-content:center}
/* pages d'entraînement des élèves : ni la clé ni l'impression (09/11/2026) ; elles restent au sommaire et en mode enseignant */
body:not(.au-sommaire) .bar #ensBtn:not(.on){display:none}
body:not(.au-sommaire):not(:has(#ensBtn.on)) .bar .menu{display:none}
body.au-sommaire #prec,body.au-sommaire #suiv,body.au-sommaire #barLecon,body.au-sommaire #tocBtn{display:none}
body:not(.au-sommaire) #barEtat{display:none}
@media (max-width:760px){.marque-t b{display:none}.bar-centre{order:3;flex-basis:100%;justify-content:center;border-top:1px solid var(--line);padding-top:.5rem}.bar-lecon span{display:none}.bar{row-gap:.35rem}.bar-niv{order:1}.bar h1{order:-1}.bar #tocBtn{order:0}}
/* photo de l'école en tête du sommaire */
.hero{position:relative;margin:0 0 1.1rem;border-radius:18px;overflow:hidden;height:clamp(9rem,22vw,13.5rem);box-shadow:0 10px 30px rgba(31,42,68,.18);background:#dfe6f3}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero figcaption{position:absolute;left:0;right:0;bottom:0;padding:2.2rem 1.3rem .9rem;color:#fff;background:linear-gradient(to top,rgba(15,22,40,.8),transparent)}
.hero small{display:block;font-weight:700;letter-spacing:.03em;opacity:.92}.hero b{font-size:1.5rem;line-height:1.2}
#ensDlg{border:0;border-radius:14px;padding:20px 24px;max-width:min(24rem,92vw);box-shadow:0 18px 50px rgba(20,30,60,.3);font-family:var(--font);color:var(--ink)}
#ensDlg::backdrop{background:rgba(20,30,60,.45)}#ensDlg h2{margin:0 0 .4rem;font-size:1.25rem}#ensDlg p{margin:0 0 .7rem;line-height:1.4}
#ensDlg label{display:block;font-weight:700;margin-bottom:.3rem}#ensMdp{width:100%;box-sizing:border-box;font:inherit;font-size:1.15rem;padding:.4rem .6rem;border:2px solid #b9c2d4;border-radius:10px}
#ensMsg{min-height:1.4em;color:#b3261e;font-weight:700}
.ens-actions{display:flex;justify-content:flex-end;gap:.6rem}
.ens-actions button{font:inherit;font-weight:700;border-radius:10px;padding:.45rem 1rem;cursor:pointer;background:#fff;color:var(--ink);border:2px solid #b9c2d4}
.ens-actions button#ensOk{background:var(--ink);color:#fff;border-color:var(--ink)}
#regDlg{border:0;border-radius:14px;padding:18px 22px;width:min(46rem,94vw);max-height:90vh;box-shadow:0 18px 50px rgba(20,30,60,.3);font-family:var(--font);color:var(--ink)}
#regDlg::backdrop{background:rgba(20,30,60,.45)}#regDlg h2{margin:0 0 .3rem;font-size:1.25rem}#regDlg h3{margin:.9rem 0 .35rem;font-size:1rem}
.rg-note{margin:0;font-size:.9rem;color:#4a5568}.rg-cl{display:flex;gap:1.2rem;flex-wrap:wrap}.rg-cl label{font-weight:700;display:flex;align-items:center;gap:.35rem}
.rg-tabs{display:inline-flex;border:1.5px solid #b9c2d4;border-radius:.5rem;overflow:hidden;margin-bottom:.4rem}.rg-tabs button{border:0;background:#fff;color:var(--ink);font:inherit;font-weight:700;padding:.25rem .8rem;cursor:pointer}.rg-tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.rg-lst{max-height:38vh;overflow:auto;border:1px solid #d5dbe8;border-radius:10px}.rg-l{display:grid;grid-template-columns:2.6rem 1fr 9.5rem 7rem auto auto;gap:.4rem;align-items:center;padding:.3rem .5rem;border-bottom:1px solid #eef1f6;font-size:.92rem}.rg-l:last-child{border-bottom:0}
.rg-l em{font-style:normal;color:#9a5b00;font-weight:700;font-size:.85rem}.rg-l em.ok{color:#1b7a3a}.rg-l button,.rg-act button{font:inherit;font-size:.85rem;border:1.5px solid #b9c2d4;background:#fff;color:var(--ink);border-radius:8px;padding:.2rem .55rem;cursor:pointer}
.rg-etapes{margin:.2rem 0 .6rem 1.1rem;padding:0;font-size:.92rem;line-height:1.45}.rg-act{display:flex;gap:.5rem;flex-wrap:wrap}.rg-act button{font-size:.95rem;font-weight:700;padding:.4rem .8rem}#regDlg .rg-charge{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.2rem 0 .5rem;font-size:.85rem;color:#4a5568}.rg-charge button{font:inherit;font-weight:700;border:1.5px solid #b9c2d4;background:#fff;color:var(--ink);border-radius:8px;padding:.3rem .7rem;cursor:pointer}
#regDlg .rg-ecole label{display:block;font-weight:700;font-size:.9rem}#regDlg .rg-ecole input[type=text]{display:block;width:100%;font:inherit;padding:.4rem .6rem;margin-top:.25rem;border:2px solid #b9c2d4;border-radius:10px}
.rg-photo{display:flex;gap:.8rem;align-items:center;margin-top:.6rem}.rg-photo>img,.rg-photo>span{width:7rem;height:4.6rem;border-radius:10px;object-fit:cover;background:#eef1f6;display:grid;place-items:center;font-size:.8rem;color:#6b7488;flex:none}
.rg-photo div{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}.rg-photo button{font:inherit;font-size:.88rem;font-weight:700;border:1.5px solid #b9c2d4;background:#fff;color:var(--ink);border-radius:8px;padding:.3rem .7rem;cursor:pointer}.rg-photo small{flex-basis:100%;color:#6b7488}
#rgMsg{min-height:1.3em;margin:.5rem 0;color:#1b7a3a;font-weight:700}
#apercuBn{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;background:#1b2437;color:#fff;border-radius:999px;padding:.5rem 1rem;font-weight:700;display:flex;gap:.8rem;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}#apercuBn button{font:inherit;font-weight:700;border-radius:999px;border:0;padding:.25rem .8rem;cursor:pointer}
@media(max-width:640px){.rg-l{grid-template-columns:2.4rem 1fr auto;}.rg-l input,.rg-l em{grid-column:2}}
@media print{#ensDlg,#regDlg,#apercuBn,.hero{display:none}}
.nouveau{display:inline-block;margin-left:.4rem;background:var(--etiq);color:#fff;border-radius:999px;padding:0 .5rem;font-size:.72rem;font-weight:700;vertical-align:middle}
.ferme-msg{max-width:34rem;margin:3rem auto;text-align:center;font-size:1.15rem;line-height:1.5}
.ferme-msg .gros{font-size:3rem;display:block}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + .4rem);background:#fff;color:var(--ink);border-radius:.6rem;box-shadow:0 8px 24px rgba(20,30,60,.25);padding:.4rem;min-width:16rem;display:none}
.menu-list.open{display:block}
.menu-list button{display:block;width:100%;text-align:left;border:0;color:var(--ink);padding:.5rem .7rem;border-radius:.4rem;font-size:.92rem}
.menu-list button:hover{background:#eef1f6}

main{max-width:60rem;margin:1.2rem auto 3rem;padding:0 .8rem}
.sheet{position:relative;background-color:var(--paper);
  background-image:linear-gradient(to right,transparent 3.4rem,var(--margin) 3.4rem,var(--margin) calc(3.4rem + 2px),transparent calc(3.4rem + 2px)),
  repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--seyes-big) 31px,var(--seyes-big) 32px),
  repeating-linear-gradient(to bottom,transparent 0,transparent 7px,var(--seyes-small) 7px,var(--seyes-small) 8px);
  border-radius:.3rem;box-shadow:0 2px 0 #d4dae6,0 10px 30px rgba(30,42,68,.12);padding:1.6rem 1.6rem 2.4rem 4.6rem;min-height:70vh}
.sheet + .sheet{margin-top:1.5rem}
.crumbs{display:none}
.crumbs a{color:var(--soft)}

/* En-tête d'une trace */
.head{display:flex;gap:1rem;align-items:center;margin-bottom:1.2rem}
.belt{flex:none;width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;color:var(--ink);border:3px solid rgba(31,42,68,.35);background:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.head h2{margin:0;font-size:2rem;line-height:1.15;color:var(--fam)}
.head .meta{font-size:.85rem;color:var(--soft)}

/* Encadrés */
.box{position:relative;background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:.7rem;padding:.7rem 1rem .5rem;margin:0 0 1rem}
.box h4{margin:0 0 .4rem;font-size:1.05rem}
.box p{margin:.3rem 0}
.box ol{margin:.3rem 0 .4rem;padding-left:1.4rem}
.box.regle{border-color:var(--fam)}
.box.regle h4{color:var(--fam)}
.box.cm1{border-color:var(--fam);border-width:3px;background:#fff}
.box.cm1 h4{color:var(--fam)}
.box.methode{border-color:#23845a;border-style:dashed}
.box.methode h4{color:#23845a}
.box.attention{border-color:#c62828;background:#fff7f6}
.box.attention h4{color:#c62828}
.box.rappel{border-color:var(--line);background:#f6f8fb}
.box.rappel h4{color:var(--soft)}
.ex{background:#f3f5f9;border-left:4px solid var(--line);padding:.35rem .7rem;border-radius:0 .4rem .4rem 0;font-size:1.02rem}
h3.sub{margin:1.6rem 0 .6rem;color:var(--fam);font-size:1.2rem}

/* Code couleur */
.s{color:var(--sujet);font-weight:700;text-decoration:underline;text-decoration-color:var(--sujet);text-underline-offset:3px}
.v{color:var(--verbe);font-weight:700;text-decoration:underline double;text-decoration-thickness:2px;text-decoration-color:var(--verbe);text-underline-offset:4px}
.t{color:var(--term);font-weight:700}
.et{color:var(--etiq);font-weight:700}
.pr{color:var(--precis);font-weight:700}
/* G6 : compléments d'objet (~…~) en indigo, compléments circonstanciels (^…^) en marron, pour ne pas reprendre le vert de l'adjectif ni l'orange du déterminant (choix de l'enseignante, 23/10/2026) */
.lecon-G6{--precis:#5e35b1;--precis-bg:#f3effc;--etiq:#8d5524;--etiq-bg:#faf3ec}
.barre{text-decoration:line-through;text-decoration-thickness:2px;color:#8a92a6}
.neg{border:2px solid var(--verbe);border-radius:.9rem;padding:0 .3rem;color:var(--verbe)}
.ind{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#23845a;text-underline-offset:4px}
.motc{border:2px solid #23845a;border-radius:1rem;padding:0 .2rem}

.tab{border-collapse:collapse;margin:.4rem 0 .6rem;width:100%;background:#fff}
.tab th,.tab td{border:1.5px solid var(--line);padding:.3rem .6rem;text-align:left;vertical-align:top}
.tab th{background:#f3f5f9}
.tab.small td{font-size:.92rem}
.tabwrap{overflow-x:auto}

.label-demo{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.tag{border:2px solid;border-radius:1rem;padding:0 .7rem;background:#fff}
.tag.et{border-color:var(--etiq);background:var(--etiq-bg)}
.tag.pr{border-color:var(--precis);background:var(--precis-bg)}
.ladder{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-weight:700;font-size:1.1rem;margin:.4rem 0}

/* Carte mentale C1 */
.mind{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start;margin-bottom:1rem}
.mind-center{grid-column:1/-1;justify-self:center;background:var(--fam);color:#fff;font-weight:700;font-size:1.3rem;padding:.4rem 1.4rem;border-radius:2rem}
.mind .box{margin:0}
@media (max-width:700px){.mind{grid-template-columns:1fr}}

/* Tableau de conjugaison */
.conj{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.6rem}
.verb{background:#fff;border:1.5px solid var(--line);border-radius:.5rem;padding:.35rem .6rem;font-size:.92rem;line-height:1.4}
.verb b{display:block;color:var(--fam);font-size:1rem;border-bottom:1.5px solid var(--line);margin-bottom:.2rem}

/* Sommaire */
.toc-title{margin:0 0 .3rem;font-size:2.1rem;color:var(--ink)}
.intro{color:var(--soft);margin:0 0 1.2rem;font-size:.95rem}
.niveaux{display:flex;gap:.6rem;flex-wrap:wrap;margin:0 0 1.4rem}
.niveaux a{flex:1 1 0;min-width:0;text-align:center;text-decoration:none;font-weight:700;font-size:1.25rem;padding:.65rem 1rem;border-radius:1rem;border:3px solid #2456a6;color:#2456a6;background:#fff}
.niveaux a.on{background:#2456a6;color:#fff}
.niveaux a small{display:block;font-weight:500;font-size:.75rem;opacity:.85}
.fam-btns{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.2rem}
.fam-btns button{font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:999px;border:2.5px solid var(--c);color:var(--c);background:#fff;transition:background .15s}
.fam-btns button:hover{background:color-mix(in srgb,var(--c) 10%,#fff)}
.fam-btns button[aria-pressed="true"]{background:var(--c);color:#fff}
.fam-btns small{font-weight:600;font-size:.74rem;opacity:.85}
@media print{.fam-btns{display:none}}
.avenir{padding:1.4rem;border:2px dashed #b8c2d6;border-radius:1rem;color:var(--soft);text-align:center;font-size:1.05rem}
.fam{margin:1.4rem 0 .4rem}
.fam h3{display:flex;align-items:baseline;gap:.6rem;margin:0 0 .6rem;font-size:1.35rem;color:var(--c)}
.fam h3 small{font-size:.8rem;color:var(--soft);font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.6rem}
.tile{display:flex;gap:.7rem;align-items:center;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--c);border-radius:.7rem;padding:.5rem .7rem;min-height:3.6rem}
a.tile:hover{background:#f6f8fb}
.tile .belt{width:2.5rem;height:2.5rem;font-size:.9rem;border-width:2.5px}
.tile .name{font-weight:700;line-height:1.2}
.tile .state{display:block;font-size:.75rem;color:var(--soft);font-weight:400}
.tile.todo{border-style:dashed;border-color:#c5cbd8;color:var(--soft)}
.tile.todo .belt{opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:.7rem;padding:.6rem 1rem;margin-top:2rem;font-size:.92rem}
.legend strong{width:100%;color:var(--soft);font-size:.85rem}

.todo-note{color:var(--soft);font-style:italic}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.8rem;margin-top:1.8rem;padding-top:1rem;border-top:2px dashed var(--line)}
.nb{display:flex;align-items:center;gap:.7rem;text-decoration:none;border-radius:.9rem;padding:.55rem 1.1rem;border:2px solid var(--fam);background:#fff;color:var(--fam);min-width:0;max-width:100%;transition:transform .12s,box-shadow .12s}
.nb:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,42,68,.14)}
.nb-prec{justify-self:start}
.nb-suiv{justify-self:end;background:var(--fam);color:#fff;text-align:right}
.nb-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nb-t b{font-size:1.15rem;font-weight:600}
.nb-t small{font-size:.8rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:15rem}
.nb-fl{font-size:1.2rem;line-height:1}
.nb-carte{justify-self:center;border:1.5px solid var(--line);color:var(--soft);padding:.45rem .9rem;font-size:.95rem;gap:.4rem}
.nb-carte:hover{color:var(--fam);border-color:var(--fam)}
@media (max-width:640px){.nav{grid-template-columns:1fr 1fr}.nb-carte{grid-column:1/-1;order:3}}

/* Édition */
.edit-bar{display:none;position:sticky;top:calc(3.1rem + env(safe-area-inset-top,0px));z-index:4;flex-wrap:wrap;gap:.35rem;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:.6rem;padding:.45rem .6rem;margin:0 0 1rem;box-shadow:0 4px 14px rgba(20,30,60,.1)}
body.editing .edit-bar{display:flex}
.edit-bar span.lbl{font-size:.8rem;color:var(--soft);margin-right:.2rem}
.edit-bar button{border:1.5px solid var(--line);background:#fff;border-radius:.4rem;padding:.1rem .55rem;font-size:.85rem;cursor:pointer}
.edit-bar button:hover{background:#f3f5f9}
.edit-bar .sep{width:1px;height:1.4rem;background:var(--line);margin:0 .2rem}
body.editing .body[contenteditable]{outline:2px dashed var(--etiq);outline-offset:6px;border-radius:.3rem}

crit) |*rien*|.", "c": "n’ + écrit : on n’écrit pas « ne écrit »."}], "atoi": {"p": "", "tasks": [{"ask": "Quelle phrase est bien écrite ?", "choose": ["Il n’aime pas la soupe.", "Il ne aime pas la soupe.", "Il aime pas la soupe."], "ok": 0, "hint": "Aime commence par une voyelle, et il faut deux mots de négation."}]}}, {"sec": "neg", "picto": "non", "titre": "Les mots de la négation", "guide": "girl", "bulle": "pas, jamais, plus, rien, personne : chaque mot a son sens.", "steps": [{"p": "Léa ne mange |*pas*| de pain.", "c": "pas : la négation simple."}, {"p": "Léa ne ment |*jamais*|.", "c": "jamais : à aucun moment."}, {"p": "Léa ne pleure |*plus*|.", "c": "plus : c’est terminé."}, {"p": "Il n’y a |*rien*| · |*personne*|", "c": "rien : aucune chose. personne : aucune personne."}], "atoi": {"p": "Il n’y a ___ dans la boîte.", "tasks": [{"ask": "Quel mot de la négation complète la phrase ? (Elle est vide.)", "choose": ["rien", "pas", "plus"], "ok": 0, "hint": "Pense à ce que la phrase veut dire.", "fill": "neg"}]}}, {"sec": "neg", "picto": "horloge", "titre": "La négation au passé", "guide": "boy", "bulle": "Au passé composé, la négation encadre le verbe avoir.", "steps": [{"p": "Léa (a) mangé."}, {"p": "Léa |*n’*|(a) |*pas*| mangé.", "c": "La négation encadre « a », pas le participe."}, {"p": "Nous |*n’*|(avons) |*pas*| joué.", "c": "Avec « avons » aussi."}], "atoi": {"p": "Léa a mangé.", "tasks": [{"ask": "Je mets cette phrase à la forme négative :", "choose": ["Léa n’a pas mangé.", "Léa a pas mangé.", "Léa ne a pas mangé."], "ok": 0, "hint": "Ne… pas encadre le verbe avoir : n’a pas, n’ont pas…"}]}}, {"sec": "excl", "picto": "exclam", "titre": "Elle exprime une émotion", "guide": "girl", "bulle": "Elle s’ajoute à n’importe quel type de phrase !", "steps": [{"p": "Le chien renverse sa gamelle !", "c": "déclarative + exclamative"}, {"p": "Range ta chambre !", "c": "impérative + exclamative"}], "atoi": {"p": "Tu as encore oublié ton cahier !", "tasks": [{"ask": "Quel est son type ?", "choose": ["déclarative", "interrogative", "impérative"], "ok": 0, "hint": "Elle raconte, elle ne pose pas de question."}, {"ask": "Quelle émotion montre le point d’exclamation ?", "choose": ["la surprise ou la colère", "aucune"], "ok": 0, "hint": "Le ! montre une émotion."}]}}, {"sec": "excl", "picto": "exclam", "titre": "Le point d’exclamation", "guide": "boy", "bulle": "Il montre une émotion : surprise, joie, colère…", "steps": [{"p": "Il fait beau.", "c": "Une phrase déclarative."}, {"p": "Il fait beau*!*", "c": "Avec un point d’exclamation : j’exprime une émotion."}, {"p": "Quel beau temps*!*", "c": "Quel, comme, que… annoncent souvent une exclamation."}], "atoi": {"p": "", "tasks": [{"ask": "Quelle phrase exprime une émotion ?", "choose": ["Quel beau dessin !", "Il fait un dessin.", "Fait-il un dessin ?"], "ok": 0, "hint": "Cherche le point d’exclamation."}]}}, {"sec": "excl", "picto": "ampoule", "titre": "Je reconnais l’émotion", "guide": "girl", "bulle": "Je lis la phrase avec la voix pour deviner l’émotion.", "steps": [{"p": "Hourra, j’ai gagné !", "c": "La joie."}, {"p": "Au secours, un loup !", "c": "La peur."}, {"p": "Tu m’énerves !", "c": "La colère."}, {"p": "Quelle belle surprise !", "c": "La surprise."}], "atoi": {"p": "Hourra, j’ai gagné !", "tasks": [{"ask": "Quelle émotion montre cette phrase ?", "choose": ["la joie", "la douleur", "la colère"], "ok": 0, "hint": "Lis la phrase avec la voix : que ressent la personne ?"}]}}]},

": [{"click": "x", "ask": "Clique sur le nom noyau.", "hint": "Quel mot ne peut-on pas enlever ?"}]}}, {"sec": "noyau", "picto": "ciseaux", "titre": "Le noyau ne s’enlève pas", "guide": "boy", "bulle": "Sans le nom noyau, on ne sait plus de quoi on parle !", "steps": [{"p": "le petit chat noir"}, {"p": "le petit {chat} noir", "c": "« le petit noir » : on ne comprend plus."}, {"p": "le {{petit}} |*chat*| {{noir}}", "c": "Le noyau reste toujours."}], "atoi": {"p": "une belle fleur jaune", "tasks": [{"ask": "Quel mot ne peut-on pas enlever ?", "choose": ["fleur", "belle", "jaune"], "ok": 0, "hint": "C’est le nom noyau."}]}}, {"sec": "adj", "picto": "ampoule", "titre": "Il dit comment est le nom", "guide": "girl", "bulle": "L’adjectif précise le nom. On peut l’enlever.", "steps": [{"p": "un ballon"}, {"p": "un ballon ~*rouge*~", "c": "Comment est le ballon ? Rouge."}, {"p": "un ~*gros*~ ballon ~rouge~", "c": "L’adjectif peut être avant ou après le nom."}, {"p": "un ~gros~ ballon ~rouge~", "c": "Dans le GN, l’adjectif placé près du nom est épithète."}], "atoi": {"p": "un <vieux> château", "tasks": [{"click": "x", "ask": "Clique sur l’adjectif.", "hint": "Comment est le château ?"}]}}, {"sec": "adj", "picto": "mots", "titre": "J’enrichis le GN", "guide": "girl", "bulle": "J’ajoute des adjectifs pour mieux décrire.", "steps": [{"p": "une souris"}, {"p": "une ~*petite*~ souris"}, {"p": "une ~petite~ souris ~*grise*~"}, {"p": "une ~petite~ souris ~grise~ et ~*timide*~", "c": "Plus j’ajoute d’adjectifs, plus c’est précis !"}], "atoi": {"p": "un ___ éléphant", "tasks": [{"choose": ["énorme", "vite", "manger"], "ok": 0, "fill": "pr", "hint": "Cherche un mot qui dit comment est l’éléphant."}]}}, {"sec": "accord", "picto": "remplacer", "titre": "Masculin ou féminin", "guide": "boy", "bulle": "Le nom noyau commande : le GN s’accorde avec lui.", "steps": [{"p": "un ami content", "c": "masculin"}, {"p": "un%e% ami%e% content%e%", "c": "féminin : j’ajoute souvent un e."}, {"p": "un g G4:{"sections": [{"id": "gn", "nom": "Les mots du GN", "couleur": "#23845a", "zone": [1.3, 6.6, 30.7, 37.9]}, {"id": "det", "nom": "Les déterminants", "couleur": "#e67e22", "zone": [34.6, 2.1, 30.7, 33.4]}, {"id": "verbe", "nom": "Verbe et pronom", "couleur": "#c62828", "zone": [68, 6.6, 30.7, 37.9]}, {"id": "adv", "nom": "L’adverbe", "couleur": "#7b3fa0", "zone": [1.3, 58.3, 31.4, 40.1]}, {"id": "conj", "nom": "Les mots qui relient", "couleur": "#00838f", "zone": [34.6, 58.3, 30.7, 40.1]}, {"id": "inv", "nom": "Variable ou invariable ?", "couleur": "#c2185b", "zone": [68, 58.3, 30.7, 40.1]}], "ecrans": [{"sec": "gn", "picto": "etiquette", "titre": "Le nom", "guide": "girl", "bulle": "Un nom désigne une personne, un animal, une chose ou une idée.", "steps": [{"p": "Léa · un chien · une table · la joie"}, {"p": "|*Léa*| · un |*chien*| · une |*table*| · la |*joie*|", "c": "Ce sont des noms."}, {"p": "^*un*^ chien · ^*la*^ joie", "c": "Je peux mettre un déterminant devant un nom commun."}], "atoi": {"p": "Le <boulanger> sourit.", "tasks": [{"click": "x", "ask": "Clique sur le nom.", "hint": "Peux-tu mettre « un » ou « le » devant ?"}]}}, {"sec": "gn", "picto": "loupe", "titre": "Je trouve la classe d’un mot", "guide": "girl", "bulle": "Je me pose des questions sur chaque mot.", "steps": [{"p": "Le petit chat dort."}, {"p": "^Le^ ~petit~ |chat| dort.", "c": "Le : déterminant · petit : adjectif · chat : nom"}, {"p": "^Le^ ~petit~ |chat| (dort).", "c": "dort change avec le temps (il dormait) : c’est un verbe."}], "atoi": {"p": "une jolie robe", "tasks": [{"choose": ["un adjectif", "un nom", "un verbe"], "ok": 0, "hint": "Il dit comment est la robe.", "ask": "Dans ce GN, « jolie » est…"}]}}, {"sec": "gn", "picto": "etiquette", "titre": "Nature ou fonction ?", "guide": "boy", "bulle": "La nature d’un mot, c’est sa classe ; sa fonction, c’est son rôle dans la phrase.", "steps": [{"p": "Le |chat| dort.", "c": "chat : un nom. C’est sa nature (sa classe)."}, {"p": "[Le chat] (dort).", "c": "Le chat : sujet du verbe. C’est sa fonction (son rôle)."}, {"p": "Léa caresse ^le^ |chat|.", "c": "chat : toujours un nom, mais ici complément du verbe."}], "atoi": {"p": "Léa caresse le chat.", "tasks": [{"choose": ["un nom, complément du verbe", "un nom, sujet du verbe", "un verbe"], "ok": 0, "hint": "Sa nature ne change pas ; son rôle, oui.", "ask": "« chat » est…"}]}}, {"sec": "det", "picto": "etiquette", "titre": "Les articles", "guide": "girl", "bulle": "Les articles sont des déterminants : le, la, l’, les ; un, une, des.", "steps": [{"p": "^le^ chien · ^la^ table · ^l’^arbre · ^les^ fleurs", "c": "Des articles définis : un nom que l’on connaît."}, {"p": "^un^ chien · ^une^ table · ^des^ fleurs", "c": "Des articles indéfinis : un nom que l’on ne connaît pas encore."}], "atoi": {"p": "", "tasks": [{"choose": ["un article défini", "un article indéfini", "un déterminant possessif"], "ok": 0, "hint": "le, la, l’, les : définis.", "ask": "Dans « la maison », « la » est…"}]}}, {"sec": "det", "picto": "etiquette", "titre": "Les déterminants possessifs", "guide": "boy", "bulle": "Ils disent à qui est la chose.", "steps": [{"p": "^le^ cartable"}, {"p": "^*mon*^ cartable · ^*ton*^ cartable · ^*son*^ cartable", "c": "À qui ? À moi, à toi, à lui ou à elle."}, {"p": "^*notre*^ classe · ^*leurs*^ cahiers", "c": "mon, ton, son, ma, ta, sa, mes, tes, ses, notre, votre, leur, nos, vos, leurs"}], "atoi": {"p": "Tom range ___ cahiers.", "tasks": [{"choose": ["ses", "son", "ces"], "ok": 0, "hint": "Les cahiers sont à Tom, et il y en a plusieurs.", "fill": "et"}]}}, {"sec": "det", "picto": "doigt", "titre": "Les déterminants démonstratifs", "guide": "boy", "bulle": "Ils montrent : ce, cet, cette, ces.", "steps": [{"p": "^*ce*^ chien · ^*cette*^ maison"}, {"p": "^*cet*^ arbre · ^*cet*^ homme", "c": "cet devant une voyelle ou un h muet."}, {"p": "^*ces*^ fleurs", "c": "ces au pluriel."}], "atoi": {"p": "___ oiseau chante.", "tasks": [{"choose": ["Cet", "Ce", "Cette"], "ok": 0, "hint": "Oiseau commence par une voyelle.", "fill": "et"}]}}, {"sec": "verbe", "picto": "horloge", "titre": "Le verbe se conjugue", "guide": "boy", "bulle": "Le verbe change avec le temps et avec le sujet.", "steps": [{"p": "Léa (chante)."}, {"p": "Hier, Léa (*chantait*).", "c": "Il change avec le temps."}, {"p": "Nous (*chantons*).", "c": "Il change avec le sujet."}], "atoi": {"p": "[Les enfants] (jouent) dans la cour.", "tasks": [{"click": "v"}]}}, {"sec": "verbe", "picto": "loupe", "titre": "Verbe ou nom ?", "guide": "boy", "bulle": "Un même mot peut être un verbe ou un nom : je regarde son rôle.", "steps": [{"p": "[Tom] (élève) des lapins.", "c": "Il change avec le temps (il élevait) : c’est un verbe."}, {"p": "^Une^ élève lit.", "c": "Je peux mettre un déterminant devant : c’est un nom."}, {"p": "[tu] (élèves) · [elles] (élèvent) / ^des^ élèves", "c": "Le verbe prend la terminaison du sujet ; le nom prend un s au pluriel."}], "atoi": {"p": "Mes voisins ___ des poules.", "tasks": [{"choose": ["élèvent", "élèves"], "ok": 0, "hint": "Mes voisins = ils : c’est un verbe → -ent.", "fill": "v"}]}}, {"sec": "verbe", "picto": "remplacer", "titre": "Le pronom remplace le nom", "guide": "boy", "bulle": "Le pronom évite de répéter le nom.", "steps": [{"p": "[Léa] (chante)."}, {"p": "[~Léa] (chante)."}, {"p": "[*Elle*] (chante).", "c": "Elle remplace Léa : c’est un pronom."}, {"p": "je · tu · il · elle · on · nous · vous · ils · elles", "c": "Les pronoms personnels."}], "atoi": {"p": "Mes cousins arrivent. ___ sont en retard.", "tasks": [{"choose": ["Ils", "Elles", "Il"], "ok": 0, "hint": "Mes cousins : plusieurs garçons.", "fill": "s"}]}}, {"sec": "verbe", "picto": "remplacer", "titre": "Pronoms sujets et compléments", "guide": "boy", "bulle": "Un pronom peut remplacer le sujet… ou un complément.", "steps": [{"p": "[Léa] (regarde) les oiseaux."}, {"p": "[*Elle*] (regarde) les oiseaux.", "c": "Elle remplace le sujet : pronom sujet."}, {"p": "[Elle] |*les*| (regarde).", "c": "les remplace « les oiseaux » : pronom complément."}, {"p": "me · te · le · la · les · lui · leur", "c": "Les pronoms compléments se placent devant le verbe."}], "atoi": {"p": "Mes amis ? Je <les> attends.", "tasks": [{"click": "x", "ask": "Clique sur le pronom complément.", "hint": "Il remplace « mes amis » et ce n’est pas le sujet."}]}}, {"sec": "adv", "picto": "ampoule", "titre": "L’adverbe précise", "guide": "girl", "bulle": "L’adverbe précise un verbe, un adjectif ou un autre adverbe.", "steps": [{"p": "Le lapin (court)."}, {"p": "Le lapin (court) |*vite*|.", "c": "Comment court-il ? Vite."}, {"p": "Le lapin (court) |*très*| |vite|.", "c": "très précise vite."}, {"p": "Il est |*très*| ~grand~.", "c": "très précise un adjectif."}], "atoi": {"p": "Tom marche <lentement>.", "tasks": [{"click": "x", "ask": "Clique sur l’adverbe.", "hint": "Comment marche-t-il ?"}]}}, {"sec": "adv", "picto": "mots", "titre": "Des adverbes en -ment", "guide": "girl", "bulle": "Beaucoup d’adverbes se terminent par -ment.", "steps": [{"p": "lent → lente → lente*ment*", "c": "J’ajoute -ment à l’adjectif au féminin."}, {"p": "doux → douce → douce*ment*"}, {"p": "joyeux → joyeuse → joyeuse*ment*"}], "atoi": {"p": "lent → ___", "tasks": [{"choose": ["lentement", "lentment", "lente"], "ok": 0, "hint": "J’ajoute -ment à l’adjectif au féminin.", "ask": "Je forme l’adverbe :", "fill": "circ"}]}}, {"sec": "conj", "picto": "mots", "titre": "Les mots qui relient", "guide": "girl", "bulle": "mais, ou, et, donc, or, ni, car relient des mots ou des phrases.", "steps": [{"p": "Je voulais sortir. Il pleuvait."}, {"p": "Je voulais sortir |*mais*| il pleuvait.", "c": "mais relie les deux parties."}, {"p": "mais · ou · et · donc · or · ni · car", "c": "Les 7 mots qui relient."}], "atoi": {"p": "Tu veux du lait ___ du jus ?", "tasks": [{"choose": ["ou", "mais", "car"], "ok": 0, "hint": "Il faut choisir entre les deux.", "fill": "circ"}]}}, {"sec": "conj", "picto": "ampoule", "titre": "Choisir le bon mot", "guide": "girl", "bulle": "Chaque mot qui relie a un sens.", "steps": [{"p": "Il est fatigué |car| il a couru.", "c": "car : la cause (= parce que)"}, {"p": "Il a couru, |donc| il est fatigué.", "c": "donc : la conséquence"}, {"p": "Il est petit |mais| il est fort.", "c": "mais : une opposition"}], "atoi": {"p": "Je mets mon manteau ___ il fait froid.", "tasks": [{"choose": ["car", "mais", "ou"], "ok": 0, "hint": "Pourquoi mettre un manteau ?", "fill": "circ"}]}}, {"sec": "inv", "picto": "attention", "titre": "Variable ou invariable ?", "guide": "boy", "bulle": "Certains mots changent, d’autres jamais.", "steps": [{"p": "^le^ |chat| ~noir~ · ^les^ |chat*s*| ~noir*s*~", "c": "Le déterminant, le nom et l’adjectif changent : ils sont variables."}, {"p": "Il parle |doucement|. / Elles parlent |doucement|.", "c": "L’adverbe ne change jamais : il est invariable."}, {"p": "lent → lente*ment* · doux → douce*ment*", "c": "Beaucoup d’adverbes finissent par -ment."}], "atoi": {"p": "", "tasks": [{"choose": ["souvent", "souris", "petit"], "ok": 0, "hint": "Cherche l’adverbe.", "ask": "Quel mot ne change jamais ?"}]}}, {"sec": "inv", "picto": "liste", "titre": "Les mots invariables", "guide": "boy", "bulle": "Certains mots ne changent jamais : ni e, ni s.", "steps": [{"p": "une fleur → des fleur*s*", "c": "Le nom est variable."}, {"p": "très · bien · souvent · mais · aujourd’hui", "c": "Ces mots ne changent jamais : ils sont invariables."}], "atoi": {"p": "", "tasks": [{"choose": ["souvent", "petit", "chat"], "ok": 0, "hint": "Il ne prend ni e, ni s.", "ask": "Quel mot ne change jamais ?"}]}}]},
G5:{"sections": [{"id": "regle", "nom": "La règle", "couleur": "#1f5fc4", "zone": [1.3, 6.6, 30.7, 37.9]}, {"id": "pronom", "nom": "Le sujet → un pronom", "couleur": "#23845a", "zone": [34.6, 2.1, 30.7, 33.4]}, {"id": "pieges", "nom": "Les pièges", "couleur": "#c62828", "zone": [68, 6.6, 30.7, 37.9]}, {"id": "groupe2", "nom": "Le 2e groupe", "couleur": "#7b3fa0", "zone": [1.3, 58.3, 40, 40.1]}, {"id": "methode", "nom": "Ma méthode", "couleur": "#e67e22", "zone": [43.7, 58.3, 55, 40.1]}], "ecrans": [{"sec": "regle", "picto": "sv", "titre": "Le sujet commande le verbe", "guide": "girl", "bulle": "Le verbe s’accorde avec son sujet.", "steps": [{"p": "[L’enfant] (joue)."}, {"p": "[Les enfants] (jou*ent*).", "c": "Le sujet change : le verbe change aussi."}, {"p": "[Tu] (joue*s*) · [Nous] (jou*ons*)", "c": "Le verbe s’accorde avec son sujet."}], "atoi": {"p": "Les oiseaux ___.", "tasks": [{"choose": ["chantent", "chante", "chantes"], "ok": 0, "hint": "Les oiseaux = ils.", "fill": "v"}]}}, {"sec": "regle", "picto": "tableau", "titre": "Les terminaisons à connaître", "guide": "girl", "bulle": "Ces terminaisons reviennent presque toujours.", "steps": [{"p": "je joue · tu joue*s* · il joue"}, {"p": "nous jou*ons* · vous jou*ez* · ils jou*ent*"}, {"p": "tu → -s · nous → -ons · vous → -ez · ils → -ent", "c": "À retenir !"}], "atoi": {"p": "Vous ___ au ballon.", "tasks": [{"choose": ["jouez", "jouer", "jouent"], "ok": 0, "hint": "Avec vous, le verbe finit par -ez.", "fill": "v"}]}}, {"sec": "pronom", "picto": "remplacer", "titre": "Je remplace le sujet", "guide": "boy", "bulle": "Je remplace le sujet par il, elle, ils ou elles.", "steps": [{"p": "[Les filles] (dansent)."}, {"p": "[~Les filles] (dansent)."}, {"p": "[*Elles*] (dans*ent*).", "c": "elles → -ent"}], "atoi": {"p": "Mes parents ___ le journal.", "tasks": [{"choose": ["lisent", "lit", "lis"], "ok": 0, "hint": "Mes parents = ils.", "fill": "v"}]}}, {"sec": "pronom", "picto": "wagon", "titre": "Plusieurs sujets", "guide": "boy", "bulle": "Plusieurs noms reliés : un seul sujet !", "steps": [{"p": "[#Léa et moi] (parl*ons*).", "c": "Léa et moi = nous"}, {"p": "[#Toi et Tom] (parl*ez*).", "c": "Toi et Tom = vous"}, {"p": "[#Léa et Tom] (parl*ent*).", "c": "Léa et Tom = ils"}], "atoi": {"p": "Mon frère et moi ___ au foot.", "tasks": [{"choose": ["jouons", "jouent", "joue"], "ok": 0, "hint": "Mon frère et moi = nous.", "fill": "v"}]}}, {"sec": "pieges", "picto": "deplacer", "titre": "Le sujet est loin du verbe", "guide": "girl", "bulle": "Des mots peuvent séparer le sujet du verbe.", "steps": [{"p": "Le chat des voisins miaule."}, {"p": "[Le chat] des voisins (miaule).", "c": "Qui est-ce qui miaule ? Le chat, pas les voisins."}, {"p": "[Le chat] {{des voisins}} (miaule).", "c": "Je barre ce qui sépare le sujet du verbe."}], "atoi": {"p": "Les fleurs du jardin ___.", "tasks": [{"choose": ["poussent", "pousse"], "ok": 0, "hint": "Qui est-ce qui pousse ? Les fleurs.", "fill": "v"}]}}, {"sec": "pieges", "picto": "deplacer", "titre": "Le sujet est après le verbe", "guide": "girl", "bulle": "Parfois, le sujet se cache après le verbe.", "steps": [{"p": "Dans le pré courent les chevaux."}, {"p": "Dans le pré (courent) [les chevaux].", "c": "Qui est-ce qui court ? Les chevaux."}, {"p": "[*Les chevaux*] (courent) dans le pré.", "c": "Je remets le sujet avant le verbe."}], "atoi": {"p": "Dans la mare ___ les grenouilles.", "tasks": [{"choose": ["sautent", "saute"], "ok": 0, "hint": "Qui est-ce qui saute ? Les grenouilles.", "fill": "v"}]}}, {"sec": "pieges", "picto": "attention", "titre": "Le petit mot devant le verbe", "guide": "girl", "bulle": "Le petit mot juste devant le verbe n’est pas toujours le sujet !", "steps": [{"p": "Je les regarde."}, {"p": "[Je] |les| (regarde).", "c": "les n’est pas le sujet !"}, {"p": "[*Je*] les (regarde).", "c": "Qui est-ce qui regarde ? Je → regarde, sans -nt."}], "atoi": {"p": "Tom les ___.", "tasks": [{"choose": ["appelle", "appellent"], "ok": 0, "hint": "Qui est-ce qui appelle ? Tom.", "fill": "v"}]}}, {"sec": "groupe2", "picto": "tableau", "titre": "Le 2e groupe : -ir avec -iss-", "guide": "boy", "bulle": "J’entends -iss- avec nous : c’est le 2e groupe.", "steps": [{"p": "finir"}, {"p": "nous fin*iss*ons · vous fin*iss*ez · ils fin*iss*ent", "c": "On entend -iss- : 2e groupe."}, {"p": "je fin*is* · tu fin*is* · il fin*it*", "c": "Au singulier : -is, -is, -it."}], "atoi": {"p": "Nous ___ nos devoirs.", "tasks": [{"choose": ["finissons", "finons", "finisons"], "ok": 0, "hint": "Au 2e groupe, nous → -issons.", "fill": "v"}]}}, {"sec": "groupe2", "picto": "attention", "titre": "Pas tous les verbes en -ir", "guide": "boy", "bulle": "Je dis « nous… » : si j’entends -iss-, c’est le 2e groupe.", "steps": [{"p": "partir → nous part*ons*", "c": "Pas de -iss- : ce n’est pas le 2e groupe."}, {"p": "grandir → nous grand*iss*ons", "c": "-iss- : c’est le 2e groupe ✔"}, {"p": "choisir · grandir · rougir · finir · remplir…"}], "atoi": {"p": "", "tasks": [{"choose": ["choisir", "partir", "venir"], "ok": 0, "hint": "Dis « nous … » : entends-tu -iss- ?", "ask": "Lequel est du 2e groupe ?"}]}}, {"sec": "methode", "picto": "liste", "titre": "Ma méthode en 4 étapes", "guide": "girl", "bulle": "Verbe, sujet, pronom, terminaison.", "steps": [{"p": "Les élèves (écout…) la maîtresse.", "c": "1. Je trouve le verbe."}, {"p": "[Les élèves] (écout…) la maîtresse.", "c": "2. Je trouve le sujet : qui est-ce qui écoute ?"}, {"p": "[Ils] (écout…) la maîtresse.", "c": "3. Je le remplace par un pronom."}, {"p": "[Les élèves] (écout*ent*) la maîtresse.", "c": "4. J’écris la terminaison : ils → -ent."}], "atoi": {"p": "Les élèves de ma classe ___ bien.", "tasks": [{"choose": ["travaillent", "travaille"], "ok": 0, "hint": "Qui est-ce qui travaille ? Les élèves = ils.", "fill": "v"}]}}, {"sec": "methode", "picto": "coche", "titre": "Je vérifie ma phrase", "guide": "girl", "bulle": "Après avoir écrit, je relis : je trouve le sujet et je vérifie le verbe.", "steps": [{"p": "Les enfants de la voisine (jouent) dehors."}, {"p": "[Les enfants de la voisine] (jouent) dehors.", "c": "1. Je cherche le sujet."}, {"p": "[*Ils*] (jouent) dehors.", "c": "2. Je le remplace : ils → -ent."}], "atoi": {"p": "", "tasks": [{"choose": ["Les enfants de la voisine jouent dehors.", "Les enfants de la voisine joue dehors.", "Les enfants de la voisine jouez dehors."], "ok": 0, "hint": "Je remplace le sujet par un pronom : ils jouent.", "ask": "Quelle phrase est bien écrite ?"}]}}]},
G6:{"sections": [{"id": "phrase", "nom": "Sujet, verbe… et plus", "couleur": "#00838f", "zone": [1.3, 6.6, 30.7, 37.9]}, {"id": "cod", "nom": "Le complément d’objet", "couleur": "#5e35b1", "zone": [34.6, 2.1, 30.7, 33.4]}, {"id": "cc", "nom": "Les compléments circonstanciels", "couleur": "#8d5524", "zone": [68, 6.6, 30.7, 37.9]}, {"id": "tests", "nom": "Les tests", "couleur": "#7b3fa0", "zone": [1.3, 58.3, 40, 40.1]}, {"id": "att", "nom": "Attention !", "couleur": "#c62828", "zone": [43.7, 58.3, 55, 40.1]}], "ecrans": [{"sec": "phrase", "picto": "sv", "titre": "Plus que sujet + verbe", "guide": "girl", "bulle": "Les compléments ajoutent des informations à la phrase.", "steps": [{"p": "[Léa] (mange)."}, {"p": "[Léa] (mange) ~*une pomme*~.", "c": "Elle mange quoi ?"}, {"p": "^*Ce matin,*^ [Léa] (mange) ~une pomme~ ^*dans la cuisine*^.", "c": "Quand ? Où ? D’autres compléments."}], "atoi": {"p": "[Tom] (lit) un livre dans son lit.", "tasks": [{"click": "s"}, {"click": "v"}]}}, {"sec": "phrase", "picto": "loupe", "titre": "Ce qui s’ajoute au sujet et au verbe", "guide": "boy", "bulle": "Je trouve d’abord le sujet et le verbe : ce qui reste, ce sont les compléments.", "steps": [{"p": "Le soir, Tom lit un livre dans son lit."}, {"p": "Le soir, [Tom] (lit) un livre dans son lit.", "c": "1. Je trouve le sujet et le verbe."}, {"p": "Le soir, [Tom] (lit) ^un livre^ ^dans son lit^.", "c": "2. Ce qui reste, ce sont les compléments."}], "atoi": {"p": "Le soir, Tom lit un livre.", "tasks": [{"choose": ["Le soir, un livre", "Tom, lit", "Tom, un livre"], "ok": 0, "hint": "Je trouve d’abord le sujet et le verbe : ce qui reste, ce sont les compléments.", "ask": "Quels groupes ne sont ni le sujet ni le verbe ?"}]}}, {"sec": "cod", "picto": "loupe", "titre": "Le complément d’objet", "guide": "boy", "bulle": "Il complète le verbe : il répond à « quoi ? » ou « à qui ? ».", "steps": [{"p": "[Léa] (mange) une pomme."}, {"p": "[Léa] (mange) quoi ? → ~*une pomme*~.", "c": "Il complète le verbe."}, {"p": "[Tom] (parle) ~*à sa mère*~.", "c": "Il parle à qui ? À sa mère."}], "atoi": {"p": "Le chat attrape <une souris>.", "tasks": [{"click": "x", "ask": "Clique sur le complément d’objet.", "hint": "Le chat attrape quoi ?"}]}}, {"sec": "cod", "picto": "attention", "titre": "Il est collé au verbe", "guide": "boy", "bulle": "Le complément d’objet ne se supprime pas et ne se déplace pas.", "steps": [{"p": "[Tom] (lance) ~le ballon~."}, {"p": "[Tom] (lance) {le ballon}.", "c": "Je supprime : Tom lance… quoi ? Il manque quelque chose."}, {"p": "{{Le ballon}} [Tom] (lance).", "c": "Je déplace : impossible !"}], "atoi": {"p": "Tom construit une cabane.", "tasks": [{"choose": ["une cabane", "Tom", "construit"], "ok": 0, "hint": "Tom construit quoi ?", "ask": "Quel est le complément d’objet ?"}]}}, {"sec": "cod", "picto": "loupe", "titre": "COD ou COI ?", "guide": "boy", "bulle": "Avec ou sans petit mot entre le verbe et le complément ?", "steps": [{"p": "[Léa] (mange) ~une pomme~.", "c": "Sans petit mot : complément d’objet direct (COD)."}, {"p": "[Tom] (parle) ~*à* sa mère~.", "c": "Avec un petit mot (à, de) : complément d’objet indirect (COI)."}, {"p": "[Léa] (mange) quoi ? → COD · [Tom] (parle) à qui ? → COI", "c": "Je pose la question juste après le verbe."}], "atoi": {"p": "Le chien obéit à son maître.", "tasks": [{"choose": ["un COI", "un COD"], "ok": 0, "hint": "Il y a le petit mot « à » : objet indirect.", "ask": "« à son maître » est…"}]}}, {"sec": "cc", "picto": "horloge", "titre": "Où ? Quand ? Comment ?", "guide": "girl", "bulle": "Les compléments circonstanciels disent où, quand ou comment.", "steps": [{"p": "^*Hier,*^ [Léa] (a joué).", "c": "Il répond à la question « quand ? »."}, {"p": "[Léa] (a joué) ^*dans le parc*^.", "c": "Il répond à la question « où ? »."}, {"p": "[Léa] (a joué) ^*joyeusement*^.", "c": "Il répond à la question « comment ? ». Je les repère, sans les classer."}], "atoi": {"p": "Le soir, Tom lit.", "tasks": [{"choose": ["quand ?", "où ?", "comment ?"], "ok": 0, "hint": "Le soir : c’est un moment.", "ask": "« Le soir » répond à la question…"}]}}, {"sec": "tests", "picto": "ciseaux", "titre": "Je supprime", "guide": "boy", "bulle": "Si je peux le supprimer, c’est un complément circonstanciel.", "steps": [{"p": "^Ce matin,^ [les élèves] (chantent) ^dans la cour^."}, {"p": "{Ce matin,} [les élèves] (chantent) {dans la cour}."}, {"p": "[Les élèves] (chantent).", "c": "La phrase a encore du sens : ce sont des compléments circonstanciels."}], "atoi": {"p": "Le chien dort sous la table.", "tasks": [{"choose": ["sous la table", "le chien", "dort"], "ok": 0, "hint": "La phrase doit garder du sens.", "ask": "Quel groupe peut-on supprimer ?"}]}}, {"sec": "tests", "picto": "deplacer", "titre": "Je déplace", "guide": "boy", "bulle": "Un complément circonstanciel peut changer de place.", "steps": [{"p": "[Les élèves] (chantent) ^dans la cour^."}, {"p": "^*Dans la cour,*^ [les élèves] (chantent).", "c": "Je peux le mettre en début de phrase."}, {"p": "[Les élèves] (chantent) ^dans la cour^.", "c": "ou le laisser à la fin."}], "atoi": {"p": "Le chat dort sur le canapé.", "tasks": [{"choose": ["Sur le canapé, le chat dort.", "Le canapé dort sur le chat.", "Dort le chat sur le canapé."], "ok": 0, "hint": "Je déplace seulement le complément circonstanciel.", "ask": "Quelle phrase déplace bien le complément ?"}]}}, {"sec": "tests", "picto": "loupe", "titre": "Complément d’objet ou circonstanciel ?", "guide": "boy", "bulle": "Je fais les deux tests : supprimer et déplacer.", "steps": [{"p": "[Léa] (cueille) des fleurs dans le jardin."}, {"p": "[Léa] (cueille) des fleurs ^*dans le jardin*^.", "c": "Je peux le supprimer et le déplacer : complément circonstanciel."}, {"p": "[Léa] (cueille) ~*des fleurs*~ ^dans le jardin^.", "c": "Je ne peux pas : complément d’objet."}], "atoi": {"p": "Léa cueille des fleurs dans le jardin.", "tasks": [{"ask": "Quel est le complément d’objet ?", "choose": ["des fleurs", "dans le jardin"], "ok": 0, "hint": "Léa cueille quoi ?"}, {"ask": "Quel est le complément circonstanciel ?", "choose": ["dans le jardin", "des fleurs"], "ok": 0, "hint": "Où ? Je peux le supprimer."}]}}, {"sec": "att", "picto": "point", "titre": "La virgule", "guide": "girl", "bulle": "En début de phrase, le complément circonstanciel est suivi d’une virgule.", "steps": [{"p": "[Les oiseaux] (chantent) ^le matin^."}, {"p": "^Le matin*,*^ [les oiseaux] (chantent).", "c": "Je le déplace au début : j’ajoute une virgule."}], "atoi": {"p": "", "tasks": [{"choose": ["Le matin, les oiseaux chantent.", "Le matin les oiseaux, chantent.", "Le, matin les oiseaux chantent."], "ok": 0, "hint": "La virgule se place juste après le complément.", "ask": "Quelle phrase est bien écrite ?"}]}}, {"sec": "att", "picto": "liste", "titre": "Plusieurs compléments", "guide": "girl", "bulle": "Une phrase peut avoir plusieurs compléments.", "steps": [{"p": "^Samedi,^ [nous] (avons mangé) ~une glace~ ^au bord de la mer^.", "c": "Trois compléments !"}, {"p": "^Samedi^ → quand ? · ^au bord de la mer^ → où ?", "c": "Deux compléments circonstanciels."}, {"p": "~une glace~ → nous avons mangé quoi ?", "c": "Un complément d’objet."}], "atoi": {"p": "Demain matin, Léa promènera son chien dans le parc.", "tasks": [{"choose": ["2", "1", "3"], "ok": 0, "hint": "Quand ? Où ?", "ask": "Combien de compléments circonstanciels ?"}]}}]},
G7:{"sections": [{"id": "gn", "nom": "Dans le GN", "couleur": "#e67e22", "zone": [1.3, 6.6, 30.7, 37.9]}, {"id": "sv", "nom": "Sujet → verbe", "couleur": "#c62828", "zone": [34.6, 2.1, 30.7, 33.4]}, {"id": "etre", "nom": "Le participe passé avec être", "couleur": "#7b3fa0", "zone": [68, 6.6, 30.7, 37.9]}, {"id": "chaine", "nom": "La chaîne complète", "couleur": "#1f5fc4", "zone": [1.3, 58.3, 50, 40.1]}, {"id": "methode", "nom": "Je vérifie", "couleur": "#23845a", "zone": [53.7, 58.3, 45, 40.1]}], "ecrans": [{"sec": "gn", "picto": "wagon", "titre": "Le nom noyau commande", "guide": "girl", "bulle": "Dans le GN, tout s’accorde avec le nom noyau.", "steps": [{"p": "un chat noir"}, {"p": "^des^ |chat*s*| ~noir*s*~", "c": "Pluriel : le nom et l’adjectif prennent un s."}, {"p": "^une^ |chatte| ~noir*e*~", "c": "Féminin : l’adjectif prend souvent un e."}], "atoi": {"p": "les ___ voitures", "tasks": [{"choose": ["petites", "petite", "petits"], "ok": 0, "hint": "Voitures : féminin pluriel.", "fill": "pr"}]}}, {"sec": "gn", "picto": "mots", "titre": "Deux adjectifs, un seul noyau", "guide": "girl", "bulle": "Tous les adjectifs s’accordent avec le même nom noyau.", "steps": [{"p": "une ~grande~ maison ~blanche~"}, {"p": "des ~grandes~ maisons ~blanches~", "c": "Maisons est au pluriel : les deux adjectifs aussi."}, {"p": "un ~grand~ chat ~blanc~", "c": "Chat est masculin : pas de e."}], "atoi": {"p": "une ___ maison blanche", "tasks": [{"choose": ["grande", "grand", "grands"], "ok": 0, "hint": "Le nom noyau commande : l’adjectif s’accorde avec lui.", "fill": "pr"}]}}, {"sec": "sv", "picto": "sv", "titre": "Le sujet commande le verbe", "guide": "boy", "bulle": "Le verbe s’accorde avec son sujet.", "steps": [{"p": "[La fille] (chante)."}, {"p": "[Les filles] (chant*ent*).", "c": "Les filles = elles → -ent"}, {"p": "[Les filles du voisin] (chant*ent*).", "c": "Le sujet peut être long : je cherche le nom noyau."}], "atoi": {"p": "Les chiens du voisin ___.", "tasks": [{"choose": ["aboient", "aboie"], "ok": 0, "hint": "Qui est-ce qui aboie ? Les chiens.", "fill": "v"}]}}, {"sec": "sv", "picto": "remplacer", "titre": "Le groupe sujet s’accorde", "guide": "boy", "bulle": "Plusieurs sujets reliés par « et » : le verbe est au pluriel.", "steps": [{"p": "[Le chat] (joue)."}, {"p": "[Le chat et le chien] (jouent).", "c": "Deux sujets : le verbe prend -ent."}, {"p": "[Ma sœur et moi] (jouons).", "c": "Ma sœur et moi = nous."}], "atoi": {"p": "Le chat et le chien ___ ensemble.", "tasks": [{"choose": ["jouent", "joue", "jouons"], "ok": 0, "hint": "Deux sujets reliés par « et » : ils.", "fill": "v"}]}}, {"sec": "etre", "picto": "tableau", "titre": "Avec être, le participe s’accorde", "guide": "girl", "bulle": "Avec être, le participe passé s’accorde avec le sujet.", "steps": [{"p": "[Tom] (est parti)."}, {"p": "[Léa] (est parti*e*).", "c": "Léa : féminin → e"}, {"p": "[Les garçons] (sont parti*s*).", "c": "pluriel → s"}, {"p": "[Les filles] (sont parti*es*).", "c": "féminin pluriel → es"}], "atoi": {"p": "Ma sœur est ___.", "tasks": [{"choose": ["tombée", "tombé", "tombés"], "ok": 0, "hint": "Ma sœur : féminin singulier.", "fill": "v"}]}}, {"sec": "etre", "picto": "ampoule", "titre": "Comme un adjectif", "guide": "girl", "bulle": "Le participe passé avec être s’accorde comme un adjectif.", "steps": [{"p": "[Léa] (est) ~content*e*~.", "c": "L’adjectif s’accorde avec Léa."}, {"p": "[Léa] (est arrivé*e*).", "c": "Le participe passé aussi !"}, {"p": "[Mes amies] (sont arrivé*es*).", "c": "Mes amies = elles : féminin pluriel."}], "atoi": {"p": "Les enfants sont ___ à l’école.", "tasks": [{"choose": ["allés", "allé", "allée"], "ok": 0, "hint": "Les enfants : masculin pluriel.", "fill": "v"}]}}, {"sec": "etre", "picto": "attention", "titre": "Avec avoir, c’est différent", "guide": "girl", "bulle": "Avec avoir, le participe passé ne s’accorde pas avec le sujet.", "steps": [{"p": "[Léa] (a mangé).", "c": "avec avoir : pas d’accord avec le sujet."}, {"p": "[Léa] (est tombé*e*).", "c": "avec être : j’accorde."}], "atoi": {"p": "Mes sœurs ont ___ une glace.", "tasks": [{"choose": ["mangé", "mangées", "mangés"], "ok": 0, "hint": "Avec avoir, je n’accorde pas avec le sujet.", "fill": "v"}]}}, {"sec": "chaine", "picto": "wagon", "titre": "Toute la chaîne", "guide": "boy", "bulle": "Le nom noyau du sujet commande toute la chaîne.", "steps": [{"p": "Les petites filles sont arrivées."}, {"p": "^Les^ ~petites~ |filles| sont arrivées.", "c": "1. Le GN sujet : féminin pluriel."}, {"p": "[Les petites filles] (*sont*) arrivées.", "c": "2. Le verbe : elles → sont."}, {"p": "[Les petites filles] (sont arrivé*es*).", "c": "3. Le participe passé : féminin pluriel → es."}], "atoi": {"p": "", "tasks": [{"choose": ["Les grandes sœurs sont venues.", "Les grande sœurs sont venues.", "Les grandes sœurs est venues."], "ok": 0, "hint": "Vérifie chaque mot : GN, verbe, participe.", "ask": "Quelle phrase est bien accordée ?"}]}}, {"sec": "chaine", "picto": "remplacer", "titre": "Je change le sujet", "guide": "boy", "bulle": "Si le sujet change, toute la chaîne change !", "steps": [{"p": "[Le petit chat] (est rentré)."}, {"p": "[Les petit*s* chat*s*] (sont rentré*s*).", "c": "Pluriel : tout change."}, {"p": "[La petit*e* chatt*e*] (est rentré*e*).", "c": "Féminin : tout change aussi."}], "atoi": {"p": "La petite chatte est ___.", "tasks": [{"choose": ["rentrée", "rentré", "rentrés"], "ok": 0, "hint": "Chatte : féminin singulier.", "fill": "v"}]}}, {"sec": "methode", "picto": "coche", "titre": "Je vérifie une phrase", "guide": "girl", "bulle": "Je trouve le nom noyau, puis je vérifie chaque mot.", "steps": [{"p": "Les vieille maisons est fermé.", "c": "Il y a des erreurs !"}, {"p": "^Les^ ~vieille~ |maisons| est fermé.", "c": "1. Le nom noyau : maisons → féminin pluriel."}, {"p": "^Les^ ~vieille*s*~ |maisons| est fermé.", "c": "2. J’accorde le GN."}, {"p": "[Les vieilles maisons] (sont fermé*es*).", "c": "3. J’accorde le verbe, puis le participe."}], "atoi": {"p": "Mes cousine est parti.", "tasks": [{"choose": ["Mes cousines sont parties.", "Mes cousines est parties.", "Mes cousine sont partis."], "ok": 0, "hint": "Cousines : féminin pluriel. Tout s’accorde.", "ask": "Quelle est la bonne correction ?"}]}}, {"sec": "methode", "picto": "coche", "titre": "Je me corrige", "guide": "girl", "bulle": "Je relis, je repère les erreurs et je corrige chaque mot.", "steps": [{"p": "Les élèves joue dans la cour.", "c": "Il y a une erreur."}, {"p": "[Les élèves] (jouent) dans la cour.", "c": "1. Le sujet est pluriel : -ent."}, {"p": "Mes cousines sont ^partie^ ; mes cousines sont ^parties^.", "c": "2. Avec être, le participe s’accorde."}], "atoi": {"p": "Les élèves joue dans la cour.", "tasks": [{"choose": ["Les élèves jouent dans la cour.", "Les élèves jouons dans la cour.", "Les élève jouent dans la cour."], "ok": 0, "hint": "Je trouve le nom noyau, puis je vérifie chaque mot.", "ask": "Quelle est la bonne correction ?"}]}}]},

/* ---------- Moteur ---------- */
const PROG={};
const progKey=id=>id==='G1'?'g1-lecon-reussi':'lecon-reussi-'+id;
function prog(id){ if(!PROG[id]){try{PROG[id]=JSON.parse(localStorage.getItem(progKey(id))||'{}')||{};}catch(e){PROG[id]={};}} return PROG[id]; }
function progSave(id){try{localStorage.setItem(progKey(id),JSON.stringify(PROG[id]));}catch(e){}}

function popIn(s){return esc(s).replace(/\*([^*]+)\*/g,'<span class="pop">$1</span>');}
function inline(s){ // marques simples à l'intérieur d'un morceau
  const pop=/^\*.*\*$/.test(s); return {pop, h: pop?esc(s.slice(1,-1)):popIn(s)};

  const re=/\{\{([^}]+)\}\}|\{([^}]+)\}|\[([^\]]+)\]|\(([^)]+)\)|\^([^^]+)\^|~([^~]+)~|%([^%]+)%|#([^#]+)#|\|([^|]+)\||§([^§]+)§|(___)|(\s*\/\s*)|([^[\](){}^~%#|_/§]+|_)/g;
  return p.replace(re,(m,old,nw,s,v,et,pr,ind,inc,circ,term,blank,br,plain)=>{
    if(old!=null) return `<span class="struck">${popIn(old.replace(/[\[\]]/g,''))}</span>`;
    if(nw!=null){ if(/^\[.*\]$/.test(nw)) return `<span class="strike"><span class="s">${esc(nw.slice(1,-1))}</span></span>`; return `<span class="strike">${popIn(nw)}</span>`;}
    if(s!=null){let cls='s';if(s[0]==='#'){cls+=' wagon';s=s.slice(1);}else if(s[0]==='~'){cls+=' leave';s=s.slice(1);}
      const x=inline(s); return `<span class="${cls}${x.pop?' pop':''}">${x.h}</span>`;}
    const wrapc=(cls,t)=>{const x=inline(t);return `<span class="${cls}${x.pop?' pop':''}">${x.h}</span>`;};
    if(v!=null) return wrapc('v',v);
    if(et!=null) return wrapc('et',et);
    if(pr!=null) return wrapc('pr',pr);
    if(ind!=null) return wrapc('hl',ind);
    if(inc!=null) return wrapc('inc',inc);
    if(circ!=null) return wrapc('circ',circ);
    if(term!=null) return wrapc('t',term); /* terminaison en violet (conjugaison) */
    if(blank!=null) return '<span class="blank">&nbsp;</span>';
    if(br!=null) return '<br>';
    return popIn(plain);
  });
}

function atoiTokens(p){
  const out=[];
  p.replace(/\[([^\]]+)\]|\(([^)]+)\)|<([^>]+)>|(___)|([^[\]()<>]+?(?=___|[[\]()<>]|$))/g,(m,s,v,x,blank,plain)=>{
    if(s!=null) out.push({t:s,r:'s'}); else if(v!=null) out.push({t:v,r:'v'}); else if(x!=null) out.push({t:x,r:'x'});
    else if(blank!=null) out.push({blank:true});
    else if(plain) plain.split(/(\s+)/).forEach(w=>{ if(!w) return; if(/^\s+$/.test(w)) out.push({sp:w}); else out.push({t:w,r:''}); });
  });
  return out;
}

function renderTrace(t,scr,direct){
  if(t.lesson){ if(typeof scr==='string'&&scr.startsWith('s:')) renderSectionMap(t,scr.slice(2)); else if(scr!=null&&LESSONS[t.id].ecrans[scr]) renderLessonScreen(t,scr,direct); else renderLessonMap(t); return; }
  document.title=t.id+' — '+t.titre;
  main.innerHTML=traceSheet(t,true);
  renderConj(main);
  const body=main.querySelector('.body');
  if(editing) body.setAttribute('contenteditable','true');
  let st;
  body.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>{edits[t.id]=body.innerHTML;save();},400);});
  $('#ebar').addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
  $('#ebar').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.id==='resetT'){
      if(edits[t.id]==null){toast("Cette trace n'a pas été modifiée.");return;}
      if(!confirm(`Revenir à la version d'origine de ${t.id} ? Vos modifications seront perdues.`)) return;
      delete edits[t.id];save();renderTrace(t);toast("Version d'origine rétablie.");return;
    }
    if(b.dataset.cmd){document.execCommand(b.dataset.cmd);body.dispatchEvent(new Event('input'));return;}
    if(b.dataset.box){insertBox(body,b.dataset.box);body.dispatchEvent(new Event('input'));return;}

  });

function selIn(body){const s=getSelection();if(!s.rangeCount)return null;const r=s.getRangeAt(0);return body.contains(r.commonAncestorContainer)?r:null;}
const MARKS=['s','v','t','et','pr','barre','neg','ind','motc'];
function wrap(body,cls){
  const r=selIn(body); if(!r){toast('Sélectionnez d’abord des mots dans la trace.');return;}
  if(cls==='clear'){
    let n=r.commonAncestorContainer; if(n.nodeType===3) n=n.parentNode;
    const spans=new Set();
    body.querySelectorAll('span').forEach(sp=>{ if(MARKS.some(m=>sp.classList.contains(m))&&r.intersectsNode(sp)) spans.add(sp); });
    let p=n; while(p&&p!==body){ if(p.tagName==='SPAN'&&MARKS.some(m=>p.classList.contains(m))) spans.add(p); p=p.parentNode; }
    spans.forEach(sp=>{sp.replaceWith(...sp.childNodes);});
    return;
  }
  if(r.collapsed){toast('Sélectionnez d’abord des mots dans la trace.');return;}
  const sp=document.createElement('span');sp.className=cls;
  sp.appendChild(r.extractContents());r.insertNode(sp);
  getSelection().removeAllRanges();
}
function insertBox(body,kind){
  const el=document.createElement(kind==='ex'?'p':'div');
  if(kind==='ex'){el.className='ex';el.textContent='Écrivez un exemple ici.';}
  else{el.className='box '+kind;el.innerHTML=kind==='attention'?'<h4>Attention !</h4><p>Écrivez ici.</p>':'<h4>Titre de l’encadré</h4><p>Écrivez ici.</p>';}
  const r=selIn(body);
  let anchor=r?r.startContainer:null; while(anchor&&anchor.parentNode!==body) anchor=anchor.parentNode;
  if(kind==='ex'&&r){let a=r.startContainer;while(a&&!(a.classList&&a.classList.contains('box')))a=a.parentNode;
    if(a){let c=r.startContainer;while(c.parentNode!==a)c=c.parentNode;c.after(el);}else if(anchor)anchor.after(el);else body.appendChild(el);}
  else if(anchor) anchor.after(el); else body.appendChild(el);
  const rg=document.createRange();rg.selectNodeContents(el.querySelector('p')||el);const s=getSelection();s.removeAllRanges();s.addRange(rg);
}

  const l=dlg.querySelector('.rg-lst');if(l)l.scrollTop=y;}

  else if('rgcp' in d){const x=fichier();(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>{$('#rgMsg').textContent='Contenu copié : sur La Forge, ouvrez ouvertures.json › Modifier › tout remplacer › Commit.';}).catch(()=>{$('#rgMsg').textContent="Copie impossible : utilisez « Télécharger ».";});}
  else if('rgap' in d){try{sessionStorage.setItem('francais-apercu','1');}catch(x){}location.reload();}
  else if('rgraz' in d){if(confirm('Annuler tous vos changements non envoyés ?')){BROUILLON={};garderBrouillon();apres();}}
  else if('rgfin' in d)dlg.close();});
 dlg.addEventListener('input',e=>{if(e.target.dataset.rgnom!=null){BROUILLON.ecole={...ecole(),nom:e.target.value};garderBrouillon();majMarque();}});
 const reduire=f=>new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.8,x=c.toDataURL('image/jpeg',q);while(x.length>450000&&q>.4){q-=.1;x=c.toDataURL('image/jpeg',q);}ok(x);};im.onerror=()=>ko();im.src=u;});

<script>
/* Leçons et traces : le papier remplit la fenêtre, en largeur comme en hauteur (même principe que la mise à l'échelle du site de maths) */
(function(){
 const main=document.getElementById('main'); if(!main)return;
 const MAX_LECON=2.2, MIN_LECON=.9, MAX_TRACE=1.35, LARGEUR_LECON=1000;
 let raf=0;
 const barre=()=>(document.querySelector('.bar')||{offsetHeight:0}).offsetHeight;
 function remettre(){
  main.style.zoom='';main.style.width='';
  const s=main.querySelector('.sheet');if(s)s.style.minHeight='';
  document.body.classList.remove('mode-plein');
  document.documentElement.style.setProperty('--bh',barre()+'px');
 }
 function fitPage(){
  remettre();
  const s=main.querySelector('.sheet');
  if(!s||!location.hash.startsWith('#t=')||innerWidth<=760)return;
  if(s.classList.contains('lesson')){
   document.body.classList.add('mode-plein');
   main.style.width=LARGEUR_LECON+'px';
   s.style.minHeight='0px';
   const cs=getComputedStyle(main), ph=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
   const w=main.getBoundingClientRect().width, h=main.getBoundingClientRect().height;
   const availW=innerWidth, availH=innerHeight-barre();
   const z=Math.max(MIN_LECON,Math.min(availW/w,availH/h,MAX_LECON))*.99;
   main.style.zoom=z.toFixed(3);
   s.style.minHeight=Math.max(0,availH/z-ph-2)+'px';   /* le papier descend jusqu'en bas de la fenêtre */
  } else {
   const w=main.getBoundingClientRect().width;
   main.style.zoom=Math.max(1,Math.min((innerWidth-32)/w,MAX_TRACE)*.98).toFixed(3);
  }
 }
 function later(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fitPage);}
 new MutationObserver(later).observe(main,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']});
 main.addEventListener('load',later,true);   /* image de la carte chargée : la hauteur change */
 addEventListener('resize',later); addEventListener('hashchange',later);
 addEventListener('beforeprint',remettre);
 addEventListener('afterprint',later);
 later();
})();
</script>
